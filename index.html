        function createPerspectiveMatrix(fov, aspect, near, far) {
            const f = 1.0 / Math.tan(fov / 2);
            const rangeInv = 1.0 / (near - far);
            return new Float32Array([
                f / aspect, 0, 0, 0,
                0, f, 0, 0,
                0, 0, (near + far) * rangeInv, -1,
                0, 0, near * far * rangeInv * 2, 0
            ]);
        }

        // シェーダー定義（手前に立体的に突き出る緑と青のホログラム板）
        const vsSource = `
            attribute vec4 aVertexPosition;
            attribute vec4 aColor;
            uniform mat4 uModelViewMatrix;
            uniform mat4 uProjectionMatrix;
            varying lowp vec4 vColor;
            void main(void) {
                gl_Position = uProjectionMatrix * uModelViewMatrix * aVertexPosition;
                vColor = aColor;
            }
        `;

        const fsSource = `
            varying lowp vec4 vColor;
            void main(void) {
                gl_FragColor = vColor;
            }
        `;

        function loadShader(gl, type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            return shader;
        }

        const fragmentShader = loadShader(gl, gl.FRAGMENT_SHADER, fsSource);

        gl.attachShader(shaderProgram, fragmentShader);

            uniformLocations: {
                projectionMatrix: gl.getUniformLocation(shaderProgram, 'uProjectionMatrix'),
                modelViewMatrix: gl.getUniformLocation(shaderProgram, 'uModelViewMatrix'),
            },
        };

        ]);

            0.1, 0.1, 0.12, 1,  0.1, 0.1, 0.12, 1,  0.1, 0.1, 0.12, 1,  0.1, 0.1, 0.12, 1,
            // 飛び出す見出し (ネオングリーン)
            0.0, 1.0, 0.53, 1,  0.0, 1.0, 0.53, 1,  0.0, 1.0, 0.53, 1,  0.0, 1.0, 0.53, 1,
            // 飛び出す写真 (シアンブルー)
            0.0, 0.68, 1.0, 1,  0.0, 0.68, 1.0, 1,  0.0, 0.68, 1.0, 1,  0.0, 0.68, 1.0, 1

これを確実に回避するため、外部からのライブラリ読み込みを一切排除し、**Meta Quest Browser単体で確実に3D物体を描画できるHTML/CSS/JS統合コード（外部読み込み完全ゼロ版）**を作成しました。

---

### 原因と対策
* **外部ライブラリ（Three.jsなど）の読み込みエラー**: ネット環境やCDNのブロックにより、ライブラリが読み込めず黒画面で停止していた可能性があります。
* **対 策**: 外部ライブラリに一切依存せず、ブラウザ標準の3D機能（WebGL）のみを用いて直接立体を描画します。
