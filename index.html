<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Hologram Newspaper - Mainichi Shimbun 2-Page Demo</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000000;
            font-family: serif;
        }
        #ui-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
        }
        .ui-btn {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            color: #00ff88;
            background: rgba(0,0,0,0.85);
            border: 2px solid #00ff88;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.4);
            transition: all 0.3s;
        }
        .ui-btn:hover {
            background: #00ff88;
            color: #000000;
        }
        #info-ui {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #00e1ff;
            font-family: sans-serif;
            font-size: 15px;
            background: rgba(0,0,0,0.85);
            padding: 10px 20px;
            border: 1px solid #00e1ff;
            border-radius: 8px;
            pointer-events: none;
            text-align: center;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="ui-container">
        <button id="flip-btn" class="ui-btn">毎日新聞 ページをめくる (1面 ↔ 2面)</button>
    </div>
    <div id="info-ui">ボタン操作で「毎日新聞」の2ページめくりを再現 / 2面下部広告にポインターを合わせると3Dポップアップ</div>

    <script>
        let scene, camera, renderer;
        let page1Group, page2Group;
        let isPage1 = true;
        let isFlipping = false;

        let beerCanGroup, beerCanMesh, pulseRing;
        let raycaster, mouse;
        let isAdHovered = false;

        init();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000); // 漆黒 RGB:0,0,0

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 1.5, 1.2);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2.0));
            document.body.appendChild(renderer.domElement);

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2(-100, -100);

            // 照明
            const ambientLight = new THREE.AmbientLight(0xffffff, 1.3);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(1, 2, 1);
            scene.add(dirLight);

            // ピボット設定（左端を折り目軸にする）
            const mainPivot = new THREE.Group();
            mainPivot.position.set(0, 1.5, -0.8);
            scene.add(mainPivot);

            // 毎日新聞 1面
            page1Group = new THREE.Group();
            page1Group.position.set(-0.4, 0, 0);
            mainPivot.add(page1Group);

            // 毎日新聞 2面（中面）
            page2Group = new THREE.Group();
            page2Group.position.set(-0.4, 0, 0);
            page2Group.rotation.y = Math.PI;
            mainPivot.add(page2Group);

            // テクスチャ生成
            const tex1 = createMainichiPage1Texture();
            const tex2 = createMainichiPage2Texture();

            const pageGeo = new THREE.PlaneGeometry(0.8, 0.8);
            pageGeo.translate(0.4, 0, 0);

            const page1Mesh = new THREE.Mesh(pageGeo, new THREE.MeshStandardMaterial({ map: tex1, side: THREE.DoubleSide, roughness: 0.3 }));
            page1Group.add(page1Mesh);

            const page2Mesh = new THREE.Mesh(pageGeo, new THREE.MeshStandardMaterial({ map: tex2, side: THREE.DoubleSide, roughness: 0.3 }));
            page2Group.add(page2Mesh);

            // ==========================================
            // 3D リアルダミー広告：生ビール缶 (毎日新聞 2面に配置)
            // ==========================================
            beerCanGroup = new THREE.Group();
            beerCanGroup.position.set(0.55, -0.22, 0.03);
            page2Group.add(beerCanGroup);

            const canGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.12, 32);
            const canMat = new THREE.MeshStandardMaterial({
                color: 0x111111,
                metalness: 0.85,
                roughness: 0.2
            });
            beerCanMesh = new THREE.Mesh(canGeo, canMat);
            beerCanMesh.name = "BEER_CAN";
            beerCanGroup.add(beerCanMesh);

            const starGeo = new THREE.OctahedronGeometry(0.018);
            const starMat = new THREE.MeshBasicMaterial({ color: 0xffd700 });
            const starMesh = new THREE.Mesh(starGeo, starMat);
            starMesh.position.set(0, 0.01, 0.041);
            starMesh.scale.set(1, 1, 0.2);
            beerCanGroup.add(starMesh);

            const ringGeo = new THREE.RingGeometry(0.05, 0.065, 32);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0x00e1ff, side: THREE.DoubleSide, transparent: true, opacity: 0.4 });
            pulseRing = new THREE.Mesh(ringGeo, ringMat);
            pulseRing.rotation.x = Math.PI / 2;
            pulseRing.position.y = -0.06;
            beerCanGroup.add(pulseRing);

            document.getElementById('flip-btn').addEventListener('click', togglePage);
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('resize', onWindowResize);

            renderer.setAnimationLoop(render);
        }

        // ==========================================
        // 毎日新聞 1面テクスチャ（実際の紙面レイアウト）
        // ==========================================
        function createMainichiPage1Texture() {
            const canvas = document.createElement('canvas');
            canvas.width = 2048; canvas.height = 2048;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#000000'; ctx.fillRect(0, 0, 2048, 2048);
            ctx.strokeStyle = '#00ff88'; ctx.lineWidth = 6; ctx.strokeRect(20, 20, 2008, 2008);

            // 毎日新聞 題字枠
            ctx.fillStyle = '#00331a'; ctx.fillRect(1520, 50, 470, 280);
            ctx.strokeStyle = '#00ff88'; ctx.lineWidth = 3; ctx.strokeRect(1520, 50, 470, 280);
            
            ctx.fillStyle = '#00ff88'; ctx.font = 'bold 110px "Hiragino Mincho ProN", serif';
            ctx.fillText('毎', 1780, 160); ctx.fillText('日', 1780, 280);
            ctx.fillText('新', 1610, 160); ctx.fillText('聞', 1610, 280);

            ctx.fillStyle = '#ffffff'; ctx.font = '22px sans-serif';
            ctx.fillText('2026年 (令和8年) 9月22日 (火曜日)', 1530, 310);

            // 1面 トップ記事見出し
            ctx.fillStyle = '#00ff88'; ctx.font = 'bold 72px serif';
            ctx.fillText('毎日新聞 3Dホログラム版 実証実験', 100, 150);

            // 縦書き本文グリッド
            ctx.strokeStyle = '#005533'; ctx.lineWidth = 1;
            for(let x = 1450; x > 100; x -= 40) {
                ctx.beginPath(); ctx.moveTo(x, 350); ctx.lineTo(x, 1950); ctx.stroke();
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
            return tex;
        }

        // ==========================================
        // 毎日新聞 2面（中面）テクスチャ
        // ==========================================
        function createMainichiPage2Texture() {
            const canvas = document.createElement('canvas');
            canvas.width = 2048; canvas.height = 2048;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#000000'; ctx.fillRect(0, 0, 2048, 2048);
            ctx.strokeStyle = '#00ff88'; ctx.lineWidth = 6; ctx.strokeRect(20, 20, 2008, 2008);

            // 毎日新聞 中面ヘッダー
            ctx.fillStyle = '#00331a'; ctx.fillRect(50, 50, 1940, 90);
            ctx.strokeStyle = '#00ff88'; ctx.lineWidth = 3; ctx.strokeRect(50, 50, 1940, 90);

            ctx.fillStyle = '#00ff88'; ctx.font = 'bold 50px "Hiragino Mincho ProN", serif';
            ctx.fillText('毎日新聞', 80, 115);
            ctx.font = 'bold 35px sans-serif'; ctx.fillText('総合・社会 ２面', 1680, 110);

            // 中面 見出し
            ctx.fillStyle = '#00ff88'; ctx.font = 'bold 65px serif';
            ctx.fillText('特定技能制度の最新運用動向と支援体制', 100, 240);

            // 縦書き本文グリッド
            ctx.strokeStyle = '#005533'; ctx.lineWidth = 1;
            for(let x = 1900; x > 100; x -= 38) {
                ctx.beginPath(); ctx.moveTo(x, 280); ctx.lineTo(x, 1320); ctx.stroke();
            }

            // 下部 広告枠 (サッポロ生ビール黒ラベル)
            ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 4;
            ctx.strokeRect(100, 1350, 1850, 640);
            ctx.fillStyle = '#05100a'; ctx.fillRect(100, 1350, 1850, 640);

            ctx.fillStyle = '#ffd700'; ctx.font = 'bold 52px serif';
            ctx.fillText('★ SAPPORO 生ビール 黒ラベル', 150, 1440);
            ctx.fillStyle = '#ffffff'; ctx.font = '28px sans-serif';
            ctx.fillText('丸くなるな、星になれ。［ ポインターを合わせて3Dポップアップ ］', 150, 1510);

            const tex = new THREE.CanvasTexture(canvas);
            tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
            return tex;
        }

        function togglePage() {
            if (isFlipping) return;
            isFlipping = true;
            isPage1 = !isPage1;
        }

        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function render() {
            const flipSpeed = 0.08;
            if (isPage1) {
                page1Group.rotation.y += (0 - page1Group.rotation.y) * flipSpeed;
                page2Group.rotation.y += (Math.PI - page2Group.rotation.y) * flipSpeed;
            } else {
                page1Group.rotation.y += (-Math.PI - page1Group.rotation.y) * flipSpeed;
                page2Group.rotation.y += (0 - page2Group.rotation.y) * flipSpeed;
            }

            if (Math.abs(page1Group.rotation.y - (isPage1 ? 0 : -Math.PI)) < 0.01) {
                isFlipping = false;
            }

            // 2面表示時のビール缶アテンション判定
            if (!isPage1) {
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObject(beerCanMesh);
                isAdHovered = intersects.length > 0;

                const targetScale = isAdHovered ? 2.2 : 1.0;
                const targetZ = isAdHovered ? 0.30 : 0.03;

                beerCanGroup.scale.lerp(new THREE.Vector3(targetScale, targetScale, targetScale), 0.1);
                beerCanGroup.position.z += (targetZ - beerCanGroup.position.z) * 0.1;

                if (isAdHovered) {
                    beerCanMesh.rotation.y += 0.03;
                    pulseRing.material.opacity = 0.9;
                    pulseRing.scale.set(1.6, 1.6, 1.6);
                } else {
                    beerCanMesh.rotation.y += 0.005;
                    pulseRing.material.opacity = 0.3;
                    pulseRing.scale.set(1.0, 1.0, 1.0);
                }
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
