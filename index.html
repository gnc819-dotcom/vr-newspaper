<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Volumetric Holographic Newspaper</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000000; /* 漆黒RGB: 0,0,0 */
            font-family: sans-serif;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
        }
        #vr-button {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 14px 28px;
            border: 1px solid #00ff88;
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.85);
            color: #00ff88;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            z-index: 999;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
        }
    </style>
    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
</head>
<body>
    <button id="vr-button">START VR (3D Volumetric)</button>
    <div id="canvas-container"></div>

    <script>
        let scene, camera, renderer;
        let mainGroup, paperMesh, particles;
        let isAnimating = false;
        let animationProgress = 0;

        const width = 1.2;
        const height = 1.2; // 1:1比率

        init();
        animate();

        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000); // 漆黒

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 1.2, 1.6);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.xr.enabled = true;
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // ライティング（立体感を生む影の配置）
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
            dirLight.position.set(1.5, 3, 2);
            dirLight.castShadow = true;
            scene.add(dirLight);

            const blueLight = new THREE.PointLight(0x00aeff, 1.5, 5);
            blueLight.position.set(-1, 1, 0.5);
            scene.add(blueLight);

            // 3Dグループ構築
            mainGroup = new THREE.Group();
            mainGroup.position.set(0, 1.2, -0.2);
            scene.add(mainGroup);

            // --- 1. 土台となる紙ベース（厚みを持つ3Dボックス構造） ---
            const baseGeo = new THREE.BoxGeometry(width, height, 0.015); // 15mmの厚み
            const baseMat = new THREE.MeshStandardMaterial({ color: 0x111115, roughness: 0.6 });
            paperMesh = new THREE.Mesh(baseGeo, baseMat);
            paperMesh.castShadow = true;
            paperMesh.receiveShadow = true;
            mainGroup.add(paperMesh);

            // --- 2. 飛び出す立体レイヤー（タイトル見出し） ---
            const titleGeo = new THREE.BoxGeometry(width * 0.9, 0.15, 0.04); // 前方に飛び出す厚み
            const titleMat = new THREE.MeshStandardMaterial({ color: 0x00ff88, roughness: 0.2, metalness: 0.5 });
            const titleMesh = new THREE.Mesh(titleGeo, titleMat);
            titleMesh.position.set(0, height * 0.35, 0.03); // 紙面より手前に配置
            mainGroup.add(titleMesh);

            // --- 3. 飛び出す立体画像ブロック ---
            const imgGeo = new THREE.BoxGeometry(width * 0.4, height * 0.4, 0.05);
            const imgMat = new THREE.MeshStandardMaterial({ color: 0x00aeff, roughness: 0.3 });
            const imgMesh = new THREE.Mesh(imgGeo, imgMat);
            imgMesh.position.set(-width * 0.22, 0, 0.04); // 手前に迫り出す
            mainGroup.add(imgMesh);

            // --- 4. 浮遊するテキストコラムライン ---
            for (let i = 0; i < 6; i++) {
                const lineGeo = new THREE.BoxGeometry(width * 0.4, 0.03, 0.01);
                const lineMat = new THREE.MeshStandardMaterial({ color: 0xdddddd });
                const lineMesh = new THREE.Mesh(lineGeo, lineMat);
                lineMesh.position.set(width * 0.22, height * 0.15 - i * 0.06, 0.02);
                mainGroup.add(lineMesh);
            }

            // --- 5. 空間に漂うホログラム粒子（3D奥行き強調） ---
            const particleCount = 200;
            const pGeo = new THREE.BufferGeometry();
            const pPositions = new Float32Array(particleCount * 3);

            for (let i = 0; i < particleCount * 3; i += 3) {
                pPositions[i] = (Math.random() - 0.5) * 3;
                pPositions[i + 1] = (Math.random() - 0.5) * 3 + 1.2;
                pPositions[i + 2] = (Math.random() - 0.5) * 3;
            }

            pGeo.setAttribute('position', new THREE.BufferAttribute(pPositions, 3));
            const pMat = new THREE.PointsMaterial({ color: 0x00ff88, size: 0.015, transparent: true, opacity: 0.7 });
            particles = new THREE.Points(pGeo, pMat);
            scene.add(particles);

            // VR設定
            const vrBtn = document.getElementById('vr-button');
            if ('xr' in navigator) {
                navigator.xr.isSessionSupported('immersive-vr').then((supported) => {
                    if (supported) {
                        vrBtn.addEventListener('click', () => {
                            navigator.xr.requestSession('immersive-vr').then((session) => {
                                renderer.xr.setSession(session);
                                vrBtn.style.display = 'none';
                            });
                        });
                    }
                });
            }

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('pointerdown', triggerInteraction);

            const c1 = renderer.xr.getController(0);
            c1.addEventListener('selectstart', triggerInteraction);
            scene.add(c1);

            const c2 = renderer.xr.getController(1);
            c2.addEventListener('selectstart', triggerInteraction);
            scene.add(c2);
        }

        function triggerInteraction() {
            if (isAnimating) return;
            isAnimating = true;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            renderer.setAnimationLoop(render);
        }

        function render() {
            // ホログラム粒子のゆらめき
            if (particles) {
                particles.rotation.y += 0.001;
            }

            // 回転インタラクション（視差効果で立体感を体感）
            if (isAnimating) {
                mainGroup.rotation.y += 0.03;
                if (mainGroup.rotation.y >= Math.PI * 2) {
                    mainGroup.rotation.y = 0;
                    isAnimating = false;
                }
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>a
