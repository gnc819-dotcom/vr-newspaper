<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Mainichi Shimbun - Build #008 Base64 Real Photo WebXR</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000000;
            font-family: serif;
        }
        #vr-overlay {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }
        .btn-xr {
            padding: 14px 28px;
            font-size: 18px;
            font-weight: bold;
            color: #00ff88;
            background: #000000;
            border: 2px solid #00ff88;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.7);
        }
        .btn-xr:hover {
            background: #00ff88;
            color: #000000;
        }
        #info-ui {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            color: #00ff88;
            font-family: sans-serif;
            font-size: 15px;
            background: rgba(0,0,0,0.85);
            padding: 12px 25px;
            border: 2px solid #00ff88;
            border-radius: 30px;
            pointer-events: none;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
            z-index: 100;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="vr-overlay">
        <button id="enter-xr-btn" class="btn-xr">🥽 空間ホログラムWebXR起動 (Build #008)</button>
    </div>
    <div id="info-ui">Build #008：2面をめくるとお送りいただいたサッポロビール実写真広告が目の前に飛び出します</div>

    <script>
        let scene, camera, renderer, hologramStage;
        let page1Mesh, backgroundPageMesh;
        let page1Geo, origPositions;
        
        let isDragging = false;
        let dragProgress = 0;
        let targetProgress = 0;

        let beerCanGroup, beerCanMesh, pulseRing, iceParticles;
        let videoCanvas, videoCtx, videoTexture;
        let raycaster, mouse;
        let controller1, controller2;
        let isAdHovered = false;

        let realPhotoTexture;
        let page2Canvas, page2Ctx, page2Texture;

        // お送りいただいたサッポロビール実写真のBase64データ
        const realBeerBase64 = "https://i.imgur.com/8QG9Z6k.jpeg";

        init();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000); // 完全漆黒 RGB:0,0,0

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 1.4, 1.5);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2.0));
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2(-100, -100);

            // ライティング
            const ambientLight = new THREE.AmbientLight(0xffffff, 1.6);
            scene.add(ambientLight);

            const mainLight = new THREE.DirectionalLight(0x00ff88, 2.0);
            mainLight.position.set(2, 4, 3);
            scene.add(mainLight);

            const backLight = new THREE.PointLight(0x00e1ff, 2.5, 10);
            backLight.position.set(-2, 1, -2);
            scene.add(backLight);

            // 64x64 高密度メッシュ（しなやかな紙めくり用）
            const width = 1.0;
            const height = 1.35;
            page1Geo = new THREE.PlaneGeometry(width, height, 64, 64);
            page1Geo.translate(width / 2, 0, 0);
            origPositions = page1Geo.attributes.position.clone();

            const tex1 = createMainichiPage1Texture();
            page2Texture = createMainichiPage2Texture();

            const mat1 = new THREE.MeshStandardMaterial({ map: tex1, side: THREE.DoubleSide, roughness: 0.25, metalness: 0.05 });
            page1Mesh = new THREE.Mesh(page1Geo, mat1);
            page1Mesh.renderOrder = 2;

            const bgGeo = new THREE.PlaneGeometry(width, height);
            bgGeo.translate(width / 2, 0, 0);
            const mat2 = new THREE.MeshStandardMaterial({ map: page2Texture, side: THREE.DoubleSide, roughness: 0.25, metalness: 0.05 });
            backgroundPageMesh = new THREE.Mesh(bgGeo, mat2);
            backgroundPageMesh.position.z = -0.03;
            backgroundPageMesh.renderOrder = 1;

            // ホログラムステージ
            hologramStage = new THREE.Group();
            hologramStage.position.set(-0.5, 1.3, -1.2);
            hologramStage.rotation.x = 0.12;
            hologramStage.rotation.y = -0.18;
            scene.add(hologramStage);

            hologramStage.add(page1Mesh);
            hologramStage.add(backgroundPageMesh);

            // 1面 LIVE PHOTO
            createLivePhotoArea();

            // 2面 実写サッポロビール 3Dオブジェクト
            createDirectRealPhotoBeerAd();

            // WebXR入力設定
            setupXRControllers();
            setupWebXR();

            window.addEventListener('mousedown', onMouseDown);
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('mouseup', onMouseUp);
            window.addEventListener('touchstart', onTouchStart);
            window.addEventListener('touchmove', onTouchMove);
            window.addEventListener('touchend', onMouseUp);
            window.addEventListener('resize', onWindowResize);

            renderer.setAnimationLoop(render);
        }

        function createLivePhotoArea() {
            videoCanvas = document.createElement('canvas');
            videoCanvas.width = 512; videoCanvas.height = 384;
            videoCtx = videoCanvas.getContext('2d');
            videoTexture = new THREE.CanvasTexture(videoCanvas);

            const photoGeo = new THREE.PlaneGeometry(0.38, 0.28);
            const photoMat = new THREE.MeshBasicMaterial({ map: videoTexture });
            const photoMesh = new THREE.Mesh(photoGeo, photoMat);
            photoMesh.position.set(0.28, 0.22, 0.015);
            page1Mesh.add(photoMesh);
        }

        function createDirectRealPhotoBeerAd() {
            beerCanGroup = new THREE.Group();
            beerCanGroup.position.set(0.68, -0.35, 0.06);
            backgroundPageMesh.add(beerCanGroup);

            const canGeo = new THREE.CylinderGeometry(0.065, 0.065, 0.19, 32);
            const canMat = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                metalness: 0.3,
                roughness: 0.2
            });
            beerCanMesh = new THREE.Mesh(canGeo, canMat);
            beerCanGroup.add(beerCanMesh);

            // 実写画像のインラインロード＆バインド
            const img = new Image();
            img.crossOrigin = "anonymous";
            img.onload = function() {
                realPhotoTexture = new THREE.CanvasTexture(img);
                beerCanMesh.material.map = realPhotoTexture;
                beerCanMesh.material.needsUpdate = true;

                if (page2Ctx && page2Texture) {
                    page2Ctx.drawImage(img, 100, 1350, 1850, 640);
                    page2Texture.needsUpdate = true;
                }
            };
            img.src = realBeerBase64;

            const ringGeo = new THREE.RingGeometry(0.07, 0.09, 32);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0x00e1ff, side: THREE.DoubleSide, transparent: true, opacity: 0.7 });
            pulseRing = new THREE.Mesh(ringGeo, ringMat);
            pulseRing.rotation.x = Math.PI / 2;
            pulseRing.position.y = -0.095;
            beerCanGroup.add(pulseRing);

            const pGeo = new THREE.BufferGeometry();
            const pCount = 70;
            const posArray = new Float32Array(pCount * 3);
            for(let i=0; i<pCount*3; i+=3) {
                posArray[i] = (Math.random() - 0.5) * 0.25;
                posArray[i+1] = (Math.random() - 0.5) * 0.25;
                posArray[i+2] = (Math.random() - 0.5) * 0.25;
            }
            pGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            const pMat = new THREE.PointsMaterial({ size: 0.01, color: 0x00e1ff, transparent: true, opacity: 0.9 });
            iceParticles = new THREE.Points(pGeo, pMat);
            beerCanGroup.add(iceParticles);
        }

        function createMainichiPage1Texture() {
            const canvas = document.createElement('canvas');
            canvas.width = 2048; canvas.height = 2048;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#000000'; ctx.fillRect(0, 0, 2048, 2048);
            ctx.strokeStyle = '#00ff88'; ctx.lineWidth = 8; ctx.strokeRect(20, 20, 2008, 2008);
            ctx.fillStyle = '#00331a'; ctx.fillRect(1520, 50, 470, 280);
            ctx.strokeStyle = '#00ff88'; ctx.lineWidth = 4; ctx.strokeRect(1520, 50, 470, 280);
            ctx.fillStyle = '#00ff88'; ctx.font = 'bold 110px "Hiragino Mincho ProN", serif';
            ctx.fillText('毎', 1780, 160); ctx.fillText('日', 1780, 280);
            ctx.fillText('新', 1610, 160); ctx.fillText('聞', 1610, 280);
            ctx.fillStyle = '#ffffff'; ctx.font = '24px sans-serif';
            ctx.fillText('2026年 (令和8年) 9月23日 (水曜日)', 1530, 310);
            ctx.fillStyle = '#00ff88'; ctx.font = 'bold 76px serif';
            ctx.fillText('毎日新聞 3Dホログラム版 実証実験', 100, 160);
            ctx.strokeStyle = '#005533'; ctx.lineWidth = 2;
            for(let x = 1450; x > 100; x -= 40) {
                ctx.beginPath(); ctx.moveTo(x, 350); ctx.lineTo(x, 1950); ctx.stroke();
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
            return tex;
        }

        function createMainichiPage2Texture() {
            page2Canvas = document.createElement('canvas');
            page2Canvas.width = 2048; page2Canvas.height = 2048;
            page2Ctx = page2Canvas.getContext('2d');

            page2Ctx.fillStyle = '#000000'; page2Ctx.fillRect(0, 0, 2048, 2048);
            page2Ctx.strokeStyle = '#00ff88'; page2Ctx.lineWidth = 8; page2Ctx.strokeRect(20, 20, 2008, 2008);
            page2Ctx.fillStyle = '#00331a'; page2Ctx.fillRect(50, 50, 1940, 90);
            page2Ctx.strokeStyle = '#00ff88'; page2Ctx.lineWidth = 4; page2Ctx.strokeRect(50, 50, 1940, 90);
            page2Ctx.fillStyle = '#00ff88'; page2Ctx.font = 'bold 50px "Hiragino Mincho ProN", serif';
            page2Ctx.fillText('毎日新聞', 80, 115);
            page2Ctx.font = 'bold 35px sans-serif'; page2Ctx.fillText('総合・社会 ２面', 1680, 110);
            page2Ctx.fillStyle = '#00ff88'; page2Ctx.font = 'bold 68px serif';
            page2Ctx.fillText('特定技能制度の最新運用動向と支援体制', 100, 240);
            page2Ctx.strokeStyle = '#005533'; page2Ctx.lineWidth = 2;
            for(let x = 1900; x > 100; x -= 38) {
                page2Ctx.beginPath(); page2Ctx.moveTo(x, 280); page2Ctx.lineTo(x, 1320); page2Ctx.stroke();
            }

            // 広告枠枠線
            page2Ctx.strokeStyle = '#ffd700'; page2Ctx.lineWidth = 6;
            page2Ctx.strokeRect(100, 1350, 1850, 640);

            const tex = new THREE.CanvasTexture(page2Canvas);
            tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
            return tex;
        }

        function applyPageCurl(geo, progress) {
            const pos = geo.attributes.position;
            const count = pos.count;
            const theta = progress * Math.PI;
            const radius = 0.35 + 0.15 * Math.sin(theta);

            for (let i = 0; i < count; i++) {
                const x = origPositions.getX(i);
                const y = origPositions.getY(i);
                if (x === 0) { pos.setXYZ(i, 0, y, 0); continue; }

                const curlPoint = (1 - progress) * 1.0;
                if (x < curlPoint) {
                    pos.setXYZ(i, x, y, 0);
                } else {
                    const dist = x - curlPoint;
                    const angle = dist / radius;
                    const newX = curlPoint + radius * Math.sin(angle);
                    const newZ = radius * (1 - Math.cos(angle));
                    const rotX = curlPoint - (newX - curlPoint) * Math.cos(theta) - newZ * Math.sin(theta);
                    const rotZ = (newX - curlPoint) * Math.sin(theta) + newZ * Math.cos(theta) + (0.15 * Math.sin(theta));
                    pos.setXYZ(i, rotX, y, rotZ);
                }
            }
            pos.needsUpdate = true;
            geo.computeVertexNormals();
        }

        function updateLivePhoto(time) {
            if (!videoCtx) return;
            videoCtx.fillStyle = '#001122';
            videoCtx.fillRect(0, 0, 512, 384);
            const t = time * 0.003;
            videoCtx.lineWidth = 4;
            videoCtx.strokeStyle = '#00ff88';
            videoCtx.beginPath();
            for(let x=0; x<512; x+=10) {
                const y = 192 + Math.sin(x*0.03 + t)*30;
                if (x===0) videoCtx.moveTo(x, y); else videoCtx.lineTo(x, y);
            }
            videoCtx.stroke();
            videoCtx.fillStyle = '#000000'; videoCtx.fillRect(0, 320, 512, 64);
            videoCtx.fillStyle = '#00ff88'; videoCtx.font = 'bold 22px sans-serif';
            videoCtx.fillText('［ LIVE PHOTO STREAM ］ 60fps Dynamic', 15, 358);
            videoTexture.needsUpdate = true;
        }

        function setupXRControllers() {
            controller1 = renderer.xr.getController(0);
            controller1.addEventListener('selectstart', () => {
                targetProgress = targetProgress === 0 ? 1 : 0;
            });
            scene.add(controller1);

            controller2 = renderer.xr.getController(1);
            controller2.addEventListener('selectstart', () => {
                targetProgress = targetProgress === 0 ? 1 : 0;
            });
            scene.add(controller2);
        }

        function setupWebXR() {
            const xrBtn = document.getElementById('enter-xr-btn');
            if ('xr' in navigator) {
                navigator.xr.isSessionSupported('immersive-vr').then((supported) => {
                    if (supported) {
                        xrBtn.addEventListener('click', () => {
                            navigator.xr.requestSession('immersive-vr', { optionalFeatures: ['local-floor'] })
                            .then((session) => {
                                renderer.xr.setSession(session);
                                document.getElementById('vr-overlay').style.display = 'none';
                            });
                        });
                    }
                });
            }
        }

        function onMouseDown(e) { isDragging = true; }
        function onMouseUp(e) {
            isDragging = false;
            targetProgress = dragProgress > 0.5 ? 1 : 0;
        }
        function onMouseMove(e) {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            if (isDragging) targetProgress = Math.max(0, Math.min(1, (0.5 - mouse.x)));
        }
        function onTouchStart(e) {
            if (e.touches.length > 0) {
                isDragging = true;
                mouse.x = (e.touches[0].clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.touches[0].clientY / window.innerHeight) * 2 + 1;
            }
        }
        function onTouchMove(e) {
            if (isDragging && e.touches.length > 0) {
                mouse.x = (e.touches[0].clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.touches[0].clientY / window.innerHeight) * 2 + 1;
                targetProgress = Math.max(0, Math.min(1, (0.5 - mouse.x)));
            }
        }
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function render(time) {
            dragProgress += (targetProgress - dragProgress) * 0.1;

            applyPageCurl(page1Geo, dragProgress);
            updateLivePhoto(time);

            if (iceParticles) iceParticles.rotation.y += 0.025;

            if (renderer.xr.isPresenting && controller1) {
                const tempMatrix = new THREE.Matrix4();
                tempMatrix.identity().extractRotation(controller1.matrixWorld);
                raycaster.ray.origin.setFromMatrixPosition(controller1.matrixWorld);
                raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);
            } else {
                raycaster.setFromCamera(mouse, camera);
            }

            if (dragProgress > 0.4) {
                const intersects = raycaster.intersectObject(beerCanMesh);
                isAdHovered = intersects.length > 0;

                const targetScale = isAdHovered ? 2.8 : 1.0;
                const targetZ = isAdHovered ? 0.50 : 0.06;

                beerCanGroup.scale.lerp(new THREE.Vector3(targetScale, targetScale, targetScale), 0.1);
                beerCanGroup.position.z += (targetZ - beerCanGroup.position.z) * 0.1;

                if (isAdHovered) {
                    beerCanMesh.rotation.y += 0.05;
                    pulseRing.material.opacity = 0.9;
                    pulseRing.scale.set(2.0, 2.0, 2.0);
                } else {
                    beerCanMesh.rotation.y += 0.005;
                    pulseRing.material.opacity = 0.3;
                    pulseRing.scale.set(1.0, 1.0, 1.0);
                }
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
