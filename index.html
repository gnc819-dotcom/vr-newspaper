<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Hologram Newspaper - Full Text Edition</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000000;
            font-family: sans-serif;
        }
        #vr-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 1000;
        }
        .btn-vr {
            padding: 20px 40px;
            font-size: 22px;
            font-weight: bold;
            color: #00ff88;
            background: #000000;
            border: 3px solid #00ff88;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.8);
        }
        .btn-vr:hover {
            background: #00ff88;
            color: #000000;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FontLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/TextGeometry.js"></script>
</head>
<body>
    <div id="vr-overlay">
        <button id="enter-vr-btn" class="btn-vr">VRモード起動（数千文字高密度充填版）</button>
    </div>

    <script>
        let scene, camera, renderer, newspaperGroup, photoCard;

        init();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000); // 漆黒 RGB:0,0,0

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 1.6, 1.0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0x00ff88, 2, 10);
            pointLight.position.set(0, 2, 0.5);
            scene.add(pointLight);

            newspaperGroup = new THREE.Group();
            newspaperGroup.position.set(0, 1.5, -1.0);
            scene.add(newspaperGroup);

            // ==========================================
            // 1. 高精細 2048x2048 Canvas（数千文字フル充填）
            // ==========================================
            const paperCanvas = document.createElement('canvas');
            paperCanvas.width = 2048;
            paperCanvas.height = 2048;
            const ctx = paperCanvas.getContext('2d');

            // 漆黒背景
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, 2048, 2048);

            // 外枠
            ctx.strokeStyle = '#00ff88';
            ctx.lineWidth = 10;
            ctx.strokeRect(30, 30, 1988, 1988);
            ctx.lineWidth = 2;
            ctx.strokeRect(44, 44, 1960, 1960);

            // --- ヘッダー領域 ---
            ctx.fillStyle = '#00ff88';
            ctx.fillRect(1400, 60, 580, 200);
            ctx.fillStyle = '#000000';
            ctx.font = 'bold 88px "Hiragino Mincho ProN", "MS Mincho", serif';
            ctx.fillText('空間日報', 1510, 190);

            ctx.fillStyle = '#00e1ff';
            ctx.font = '28px sans-serif';
            ctx.fillText('2026年 (令和8年) 9月22日 火曜日 【創刊特別号】', 60, 100);
            ctx.fillText('発行所：空間新聞社 3D HOLOGRAPHIC MEDIA LAB', 60, 140);
            ctx.fillText('規格：Q42 3D-Hologram Fan / 2048x2048 / High-Density Text', 60, 180);

            ctx.strokeStyle = '#00e1ff';
            ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(60, 280); ctx.lineTo(1988, 280); ctx.stroke();

            // --- メイン大見出し ---
            ctx.fillStyle = '#00ff88';
            ctx.font = 'bold 68px "Hiragino Sans", "Meiryo", sans-serif';
            ctx.fillText('3Dホログラム新聞、本格実用化へ始動', 60, 360);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 36px sans-serif';
            ctx.fillText('〜 WebXRと立体透過表示技術が融合、紙面から飛び出す数千文字の空間情報体験 〜', 60, 420);

            ctx.strokeStyle = '#00ff88';
            ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(60, 460); ctx.lineTo(1988, 460); ctx.stroke();

            // --- 長文テキスト流し込み関数 ---
            function fillColumnText(text, x, y, width, lineHeight, fontSize, color) {
                ctx.fillStyle = color;
                ctx.font = `${fontSize}px sans-serif`;
                let chars = text.split('');
                let currentLine = '';
                let currentY = y;

                for (let i = 0; i < chars.length; i++) {
                    let testLine = currentLine + chars[i];
                    let metrics = ctx.measureText(testLine);
                    if (metrics.width > width && i > 0) {
                        ctx.fillText(currentLine, x, currentY);
                        currentLine = chars[i];
                        currentY += lineHeight;
                    } else {
                        currentLine = testLine;
                    }
                }
                ctx.fillText(currentLine, x, currentY);
                return currentY + lineHeight;
            }

            // 本格的な長文ニュース記事（数千文字規模）
            const textArticle1 = "【空間メディア取材班】紙面の制約を飛び出し、立体空間上に展開する新しい情報体「3Dホログラム新聞」の実機検証が本格的に始まった。従来の平面ディスプレイや紙媒体と異なり、視覚的な奥行き（パララックス効果）を活用することで、重要見出しや報道写真が空間へ手前に飛び出す表現が可能となった。特にQ42規格に対応した透過度制御と、WebXRによる没入レンダリング技術の組み合わせにより、情報へのアクセス体験が根本から進化している。取材班の初期データによると、立体空間における情報提示は従来の平面画面と比較して認知負荷を軽減しつつ、記憶定着率を大幅に引き上げる効果が実証された。今後は各地のサイネージや店頭、家庭内端末に向けてリアルタイムでの速報配信システムを構築していく方針である。";

            const textArticle2 = "本プロジェクトにおける最大のイノベーションは、背景領域に完全な漆黒（RGB:0,0,0）を配することで、ホログラムファン等の光学機器を通して文字のみを空間に浮遊させる点にある。これにより、透過型のスマートグラスやXRヘッドセットを装着した際にも、実世界の背景と干渉することなく極めて高いコントラストでニュース文章を読破することができる。また、2048ピクセル超の高解像度テクスチャマッピングを採用することで、実際の新聞紙面と同等以上の高密度な段組み構成を実現。ユーザーは近接観察によって細小文字まで鮮明に可読することが可能となった。";

            const textArticle3 = "【法規制とAIガバナンス】労働基準法および入管法をはじめとする最新の各種法規制への適応も、次世代メディアにおける重要な柱となっている。自動化されたコンプライアンス管理ツールは、契約書面や各種労働手続きの整合性をリアルタイムで解析評価する。新聞メディアが長年培ってきた高い社会的信頼性と、最先端の人工知能アルゴリズムが融合することで、正確かつ迅速な情報提供プラットフォームの確立を目指す。";

            const textArticle4 = "【社説】立体空間におけるメディアの未来と課題。紙媒体が長年培ってきた「レイアウトによる情報の重み付け」は、デジタル空間においても極めて重要な要素である。単に画面を3D化するだけでなく、Z軸（奥行き方向）を利用したプライオリティ表現がこれからの空間デザインの標準となる。我々はこの技術を単なる一時の演出にとどめず、社会インフラとしての情報共有手段へと高めていかなければならない。情報過多の時代において、真に必要なニュースを直感的に捉え、正確に理解するための空間UI設計が今まさに求められている。";

            // --- 6カラム多段組による超高密度レイアウト ---
            const colWidth = 285;
            const startY = 500;
            const colGap = 320;

            // 各カラムへの大量テキスト配置
            fillColumnText("【トップニュース詳細】\n" + textArticle1, 60, startY, colWidth, 24, 15, '#cccccc');
            fillColumnText("【技術解剖と光学設計】\n" + textArticle2, 60 + colGap * 1, startY, colWidth, 24, 15, '#cccccc');
            
            // 中央写真枠（Z:+12cmに浮かぶカードの背面領域）
            ctx.strokeStyle = '#00ff88';
            ctx.lineWidth = 2;
            ctx.strokeRect(60 + colGap * 2, startY, 600, 450);
            ctx.fillStyle = '#00ff88';
            ctx.font = '18px sans-serif';
            ctx.fillText('［ HOLOGRAM PHOTO DISPLAY ZONE ］', 60 + colGap * 2 + 20, startY + 30);
            
            fillColumnText("【写真解説】最前面に浮遊する3Dカードは、光の脈動とともにリアルタイムでアニメーションを行う。紙面から立体的に飛び出すことで視覚的インパクトを最大化する。", 60 + colGap * 2, startY + 500, 600, 24, 15, '#aaaaaa');

            fillColumnText("【社会・法規制動向】\n" + textArticle3, 60 + colGap * 4, startY, colWidth, 24, 15, '#cccccc');
            fillColumnText("【社説・空間メディア論】\n" + textArticle4, 60 + colGap * 5, startY, colWidth, 24, 15, '#cccccc');

            // 仕切り線
            ctx.strokeStyle = '#222222';
            ctx.lineWidth = 1;
            for(let i = 1; i <= 5; i++) {
                if(i !== 3) {
                    ctx.beginPath(); ctx.moveTo(35 + colGap * i, startY); ctx.lineTo(35 + colGap * i, 1950); ctx.stroke();
                }
            }

            // 下部追加ニュースライン（隙間なく充填）
            ctx.strokeStyle = '#00e1ff';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(60, 1300); ctx.lineTo(1988, 1300); ctx.stroke();

            ctx.fillStyle = '#00ff88';
            ctx.font = 'bold 28px sans-serif';
            ctx.fillText('【空間総合・経済速報】全領域高密度テキストエリア', 60, 1340);

            for(let c = 0; c < 6; c++) {
                fillColumnText(`【連載第${c+1}回】次世代ディスプレイ規格Q42における文字可読性と輝度分布の相関関係に関する研究報告。` + textArticle1.substring(0, 150), 60 + colGap * c, 1380, colWidth, 22, 14, '#aaaaaa');
            }

            // Canvasテクスチャ作成
            const paperTexture = new THREE.CanvasTexture(paperCanvas);
            paperTexture.minFilter = THREE.LinearFilter;
            paperTexture.magFilter = THREE.LinearFilter;

            const baseGeo = new THREE.PlaneGeometry(0.8, 0.8);
            const baseMat = new THREE.MeshBasicMaterial({ map: paperTexture, side: THREE.DoubleSide });
            const baseMesh = new THREE.Mesh(baseGeo, baseMat);
            newspaperGroup.add(baseMesh);

            // ==========================================
            // 2. 飛び出す立体3D文字（Z: +6cm）
            // ==========================================
            const loader = new THREE.FontLoader();
            loader.load('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/fonts/helvetiker_bold.typeface.json', function (font) {
                const textGeo = new THREE.TextGeometry('3D NEWSPAPER', {
                    font: font,
                    size: 0.048,
                    height: 0.018,
                    curveSegments: 12,
                    bevelEnabled: true,
                    bevelThickness: 0.002,
                    bevelSize: 0.001,
                    bevelSegments: 5
                });

                const textMat = new THREE.MeshStandardMaterial({
                    color: 0x00ff88,
                    emissive: 0x003311,
                    metalness: 0.8,
                    roughness: 0.2
                });

                const textMesh = new THREE.Mesh(textGeo, textMat);
                textMesh.position.set(-0.36, 0.21, 0.06);
                newspaperGroup.add(textMesh);
            });

            // ==========================================
            // 3. 最前面 ホログラムフォトフレーム（Z: +12cm）
            // ==========================================
            const cardCanvas = document.createElement('canvas');
            cardCanvas.width = 512;
            cardCanvas.height = 512;
            const cCtx = cardCanvas.getContext('2d');

            const grad = cCtx.createRadialGradient(256, 256, 20, 256, 256, 256);
            grad.addColorStop(0, '#00e1ff');
            grad.addColorStop(0.8, '#001133');
            grad.addColorStop(1, '#00ff88');
            cCtx.fillStyle = grad;
            cCtx.fillRect(0, 0, 512, 512);

            cCtx.strokeStyle = '#ffffff';
            cCtx.lineWidth = 10;
            cCtx.strokeRect(20, 20, 472, 472);

            cCtx.fillStyle = '#ffffff';
            cCtx.font = 'bold 36px sans-serif';
            cCtx.textAlign = 'center';
            cCtx.fillText('2048px HIGH-RES', 256, 250);
            cCtx.fillText('HOLOGRAM PHOTO', 256, 300);

            const cardTexture = new THREE.CanvasTexture(cardCanvas);
            const cardGeo = new THREE.BoxGeometry(0.24, 0.18, 0.02);
            const cardMat = new THREE.MeshStandardMaterial({
                map: cardTexture,
                roughness: 0.1,
                metalness: 0.5
            });

            photoCard = new THREE.Mesh(cardGeo, cardMat);
            photoCard.position.set(-0.02, 0.08, 0.12);
            newspaperGroup.add(photoCard);

            // ==========================================
            // 4. WebXR 起動
            // ==========================================
            const vrBtn = document.getElementById('enter-vr-btn');
            if ('xr' in navigator) {
                navigator.xr.isSessionSupported('immersive-vr').then((supported) => {
                    if (supported) {
                        vrBtn.addEventListener('click', () => {
                            navigator.xr.requestSession('immersive-vr', {
                                optionalFeatures: ['local-floor']
                            }).then((session) => {
                                renderer.xr.setSession(session);
                                document.getElementById('vr-overlay').style.display = 'none';
                            });
                        });
                    }
                });
            }

            renderer.setAnimationLoop(render);
            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function render(time) {
            if (newspaperGroup) {
                newspaperGroup.rotation.y = Math.sin(time * 0.0008) * 0.12;
            }
            if (photoCard) {
                photoCard.position.y = 0.08 + Math.sin(time * 0.002) * 0.015;
                photoCard.rotation.y = Math.sin(time * 0.001) * 0.15;
            }
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
