<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Newspaper - Quest 3 Debug</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000000;
            font-family: sans-serif;
        }
        #vr-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 1000;
            width: 90%;
            max-width: 500px;
        }
        .btn-vr {
            padding: 20px 40px;
            font-size: 22px;
            font-weight: bold;
            color: #00ff88;
            background: #000000;
            border: 3px solid #00ff88;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.8);
            width: 100%;
        }
        #debug-log {
            margin-top: 20px;
            padding: 15px;
            background: rgba(20, 20, 20, 0.9);
            border: 1px solid #ff4444;
            color: #ff6666;
            font-family: monospace;
            font-size: 14px;
            text-align: left;
            border-radius: 8px;
            max-height: 200px;
            overflow-y: auto;
            word-break: break-all;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="vr-overlay">
        <button id="enter-vr-btn" class="btn-vr">VRモード起動（デバッグ）</button>
        <div id="debug-log">ステータス: 準備完了</div>
    </div>

    <script>
        let scene, camera, renderer, newspaperGroup;
        const logEl = document.getElementById('debug-log');

        function log(msg) {
            logEl.innerHTML += '<br>> ' + msg;
            console.log(msg);
        }

        init();

        function init() {
            // HTTPSチェック
            if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
                log('【エラー】WebXRはHTTPS接続が必須です。URLがhttps://で始まっているか確認してください。');
            }

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 1.6, 1.0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
            scene.add(ambientLight);

            newspaperGroup = new THREE.Group();
            newspaperGroup.position.set(0, 1.5, -1.0);
            scene.add(newspaperGroup);

            // 簡易板モデル
            const baseGeo = new THREE.PlaneGeometry(0.8, 0.8);
            const baseMat = new THREE.MeshBasicMaterial({ color: 0x00ff88, wireframe: true });
            const baseMesh = new THREE.Mesh(baseGeo, baseMat);
            newspaperGroup.add(baseMesh);

            const vrBtn = document.getElementById('enter-vr-btn');

            if ('xr' in navigator) {
                log('WebXR API: 検出成功');
                navigator.xr.isSessionSupported('immersive-vr').then((supported) => {
                    if (supported) {
                        log('immersive-vr セッション: サポートされています');
                        vrBtn.addEventListener('click', onVRButtonClick);
                    } else {
                        log('【エラー】このデバイス/ブラウザは immersive-vr セッションに対応していません。');
                    }
                }).catch((err) => {
                    log('サポート確認失敗: ' + err.message);
                });
            } else {
                log('【エラー】navigator.xr が定義されていません（非対応ブラウザまたは非HTTPS）。');
            }

            renderer.setAnimationLoop(() => {
                newspaperGroup.rotation.y += 0.005;
                renderer.render(scene, camera);
            });
        }

        function onVRButtonClick() {
            log('VRボタンが押されました。セッションを要求中...');
            
            // 定義済みの参照機能のみで起動を試行
            navigator.xr.requestSession('immersive-vr', {
                optionalFeatures: ['local-floor']
            }).then((session) => {
                log('VRセッション開始成功！');
                renderer.xr.setSession(session);
                document.getElementById('vr-overlay').style.display = 'none';
            }).catch((err) => {
                log('【VRセッションエラー】: ' + err.name + ' - ' + err.message);
            });
        }
    </script>
</body>
</html>
