<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Hologram Newspaper - Upgrade</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000000;
            font-family: sans-serif;
        }
        #vr-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 1000;
        }
        .btn-vr {
            padding: 20px 40px;
            font-size: 22px;
            font-weight: bold;
            color: #00ff88;
            background: #000000;
            border: 3px solid #00ff88;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.8);
        }
        .btn-vr:hover {
            background: #00ff88;
            color: #000000;
        }
    </style>
    <!-- Three.js & FontLoader / TextGeometry -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FontLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/TextGeometry.js"></script>
</head>
<body>
    <div id="vr-overlay">
        <button id="enter-vr-btn" class="btn-vr">VRモード起動（立体テキスト版）</button>
    </div>

    <script>
        let scene, camera, renderer, newspaperGroup, photoCard;

        init();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 1.6, 1.0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0x00ff88, 2, 10);
            pointLight.position.set(0, 2, 0.5);
            scene.add(pointLight);

            newspaperGroup = new THREE.Group();
            newspaperGroup.position.set(0, 1.5, -1.0);
            scene.add(newspaperGroup);

            // --- 1. 高精細キャンバス（紙面ベース） ---
            const paperCanvas = document.createElement('canvas');
            paperCanvas.width = 1024;
            paperCanvas.height = 1024;
            const ctx = paperCanvas.getContext('2d');

            // 漆黒背景
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, 1024, 1024);

            // ネオン枠線
            ctx.strokeStyle = '#00ff88';
            ctx.lineWidth = 8;
            ctx.strokeRect(16, 16, 992, 992);

            // 題字エリア
            ctx.fillStyle = '#00ff88';
            ctx.fillRect(650, 40, 330, 120);
            ctx.fillStyle = '#000000';
            ctx.font = 'bold 40px sans-serif';
            ctx.fillText('3D DAILY NEWS', 665, 110);

            // 日付・見出しライン
            ctx.fillStyle = '#00e1ff';
            ctx.font = '24px monospace';
            ctx.fillText('2026.09.22 | SPECIAL EDITION', 40, 70);

            // 記事本文ライン（ハイコントラスト表示）
            ctx.fillStyle = '#666666';
            for (let i = 0; i < 14; i++) {
                ctx.fillRect(500, 260 + (i * 32), 470, 8);
            }
            for (let i = 0; i < 10; i++) {
                ctx.fillRect(40, 680 + (i * 28), 930, 6);
            }

            const paperTexture = new THREE.CanvasTexture(paperCanvas);
            const baseGeo = new THREE.PlaneGeometry(0.8, 0.8);
            const baseMat = new THREE.MeshBasicMaterial({ map: paperTexture, side: THREE.DoubleSide });
            const baseMesh = new THREE.Mesh(baseGeo, baseMat);
            newspaperGroup.add(baseMesh);

            // --- 2. 飛び出す立体3D文字（TextGeometry） ---
            const loader = new THREE.FontLoader();
            // Google Open Source Font
            loader.load('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/fonts/helvetiker_bold.typeface.json', function (font) {
                const textGeo = new THREE.TextGeometry('3D NEWSPAPER', {
                    font: font,
                    size: 0.05,
                    height: 0.015, // 奥行き・厚み
                    curveSegments: 12,
                    bevelEnabled: true,
                    bevelThickness: 0.002,
                    bevelSize: 0.001,
                    bevelSegments: 5
                });

                const textMat = new THREE.MeshStandardMaterial({
                    color: 0x00ff88,
                    emissive: 0x004422,
                    metalness: 0.8,
                    roughness: 0.2
                });

                const textMesh = new THREE.Mesh(textGeo, textMat);
                textMesh.position.set(-0.36, 0.22, 0.06); // 手前6cmに配置
                newspaperGroup.add(textMesh);
            });

            // --- 3. 手前に最前面で浮遊するホログラムフォトカード（Z: +12cm） ---
            const cardCanvas = document.createElement('canvas');
            cardCanvas.width = 512;
            cardCanvas.height = 512;
            const cCtx = cardCanvas.getContext('2d');

            const grad = cCtx.createRadialGradient(256, 256, 20, 256, 256, 256);
            grad.addColorStop(0, '#00e1ff');
            grad.addColorStop(0.8, '#001133');
            grad.addColorStop(1, '#00ff88');
            cCtx.fillStyle = grad;
            cCtx.fillRect(0, 0, 512, 512);

            cCtx.strokeStyle = '#ffffff';
            cCtx.lineWidth = 10;
            cCtx.strokeRect(20, 20, 472, 472);

            cCtx.fillStyle = '#ffffff';
            cCtx.font = 'bold 36px sans-serif';
            cCtx.textAlign = 'center';
            cCtx.fillText('HOLOGRAM PHOTO', 256, 270);

            const cardTexture = new THREE.CanvasTexture(cardCanvas);
            const cardGeo = new THREE.BoxGeometry(0.3, 0.3, 0.02);
            const cardMat = new THREE.MeshStandardMaterial({
                map: cardTexture,
                roughness: 0.1,
                metalness: 0.5
            });

            photoCard = new THREE.Mesh(cardGeo, cardMat);
            photoCard.position.set(-0.18, -0.08, 0.12); // 最前面12cm
            newspaperGroup.add(photoCard);

            // WebXR 起動
            const vrBtn = document.getElementById('enter-vr-btn');
            if ('xr' in navigator) {
                navigator.xr.isSessionSupported('immersive-vr').then((supported) => {
                    if (supported) {
                        vrBtn.addEventListener('click', () => {
                            navigator.xr.requestSession('immersive-vr', {
                                optionalFeatures: ['local-floor']
                            }).then((session) => {
                                renderer.xr.setSession(session);
                                document.getElementById('vr-overlay').style.display = 'none';
                            });
                        });
                    }
                });
            }

            renderer.setAnimationLoop(render);
            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function render(time) {
            if (newspaperGroup) {
                newspaperGroup.rotation.y = Math.sin(time * 0.0008) * 0.15; // 左右に低速首振り
            }
            if (photoCard) {
                // 最前面のフォトカードがわずかに上下に浮遊＋自転
                photoCard.position.y = -0.08 + Math.sin(time * 0.002) * 0.02;
                photoCard.rotation.y = Math.sin(time * 0.001) * 0.2;
            }
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
