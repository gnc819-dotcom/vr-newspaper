<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Holographic Newspaper Q42 - VR Immersive</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000000; /* 漆黒 RGB:0,0,0 */
            font-family: sans-serif;
        }
        #vr-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 1000;
        }
        .btn-vr {
            padding: 20px 40px;
            font-size: 22px;
            font-weight: bold;
            color: #00ff88;
            background: #000000;
            border: 3px solid #00ff88;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.8);
        }
        .btn-vr:hover {
            background: #00ff88;
            color: #000000;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="vr-overlay">
        <button id="enter-vr-btn" class="btn-vr">VRモード起動（没入）</button>
    </div>

    <script>
        let scene, camera, renderer, newspaperGroup;

        init();

        function init() {
            // 1. シーン定義（漆黒: 0,0,0）
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);

            // 2. カメラ
            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 1.6, 1.0); // 人間の目線の高さに配置

            // 3. レンダラー
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.xr.enabled = true; // WebXR有効化
            document.body.appendChild(renderer.domElement);

            // 4. 光源
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0x00ff88, 1.5);
            dirLight.position.set(1, 2, 1);
            scene.add(dirLight);

            // 5. 3Dホログラム新聞モデル（1:1 比率 / Q42用）
            newspaperGroup = new THREE.Group();
            newspaperGroup.position.set(0, 1.5, -1.0); // 目の前1mの空間に浮遊
            scene.add(newspaperGroup);

            // ベースボード
            const baseGeo = new THREE.BoxGeometry(0.8, 0.8, 0.02);
            const baseMat = new THREE.MeshStandardMaterial({ color: 0x111115 });
            const baseMesh = new THREE.Mesh(baseGeo, baseMat);
            newspaperGroup.add(baseMesh);

            // 飛び出す緑見出し
            const titleGeo = new THREE.BoxGeometry(0.72, 0.15, 0.06);
            const titleMat = new THREE.MeshStandardMaterial({ color: 0x00ff88, metalness: 0.4 });
            const titleMesh = new THREE.Mesh(titleGeo, titleMat);
            titleMesh.position.set(0, 0.28, 0.04);
            newspaperGroup.add(titleMesh);

            // 飛び出す青写真ブロック
            const photoGeo = new THREE.BoxGeometry(0.34, 0.34, 0.08);
            const photoMat = new THREE.MeshStandardMaterial({ color: 0x00aeff });
            const photoMesh = new THREE.Mesh(photoGeo, photoMat);
            photoMesh.position.set(-0.18, -0.05, 0.06);
            newspaperGroup.add(photoMesh);

            // 6. WebXR 没入セッション起動
            const vrBtn = document.getElementById('enter-vr-btn');

            if ('xr' in navigator) {
                navigator.xr.isSessionSupported('immersive-vr').then((supported) => {
                    if (supported) {
                        vrBtn.addEventListener('click', () => {
                            navigator.xr.requestSession('immersive-vr', {
                                optionalFeatures: ['local-floor', 'bounded-floor']
                            }).then((session) => {
                                renderer.xr.setSession(session);
                                document.getElementById('vr-overlay').style.display = 'none';
                            }).catch((err) => {
                                alert('VRセッション開始失敗: ' + err.message);
                            });
                        });
                    } else {
                        vrBtn.textContent = 'WebXR没入非対応デバイスです';
                    }
                });
            } else {
                vrBtn.textContent = 'WebXR未サポートブラウザです';
            }

            renderer.setAnimationLoop(render);
            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function render() {
            if (newspaperGroup) {
                newspaperGroup.rotation.y += 0.005; // 低速回転
            }
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
