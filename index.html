<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Mainichi Shimbun - LivePhoto & Super Sizzle 3D Ad</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000000;
            font-family: serif;
        }
        #info-ui {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            color: #00ff88;
            font-family: sans-serif;
            font-size: 15px;
            background: rgba(0, 0, 0, 0.88);
            padding: 12px 28px;
            border: 2px solid #00ff88;
            border-radius: 30px;
            pointer-events: none;
            text-align: center;
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.6);
            z-index: 100;
        }
        #sizzle-caption {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffd700;
            font-family: 'Hiragino Mincho ProN', serif;
            font-size: 20px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #ffd700, 0 0 20px #ff6600;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.8s ease;
            z-index: 100;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="sizzle-caption">【超極冷】キンキンに冷えた生ビールが目の前に飛び出す！</div>
    <div id="info-ui">右端をつかんでドラッグ：しなやかにページをめくります（1面：LIVEPHOTO動作中）</div>

    <script>
        let scene, camera, renderer;
        let page1Mesh, backgroundPageMesh;
        let page1Geo, origPositions;
        let page1Texture, page2Texture;
        
        let isDragging = false;
        let dragProgress = 0;
        let targetProgress = 0;

        // LIVEPHOTO関連
        let livePhotoCanvas, livePhotoCtx, livePhotoTexture;
        let livePhotoAnimTime = 0;

        // ビール3D広告演出関連
        let beerCanGroup, beerCanMesh, frostParticles, coldSteamGroup;
        let raycaster, mouse;
        let isAdHovered = false;

        init();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);

            camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0.1, 0.15, 2.3);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2.0));
            document.body.appendChild(renderer.domElement);

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2(-100, -100);

            // ライティング
            const ambientLight = new THREE.AmbientLight(0xffffff, 1.1);
            scene.add(ambientLight);

            const greenSpot = new THREE.SpotLight(0x00ff88, 2.5);
            greenSpot.position.set(3, 4, 3);
            scene.add(greenSpot);

            const beerAmberLight = new THREE.PointLight(0xffaa00, 3.5, 5);
            beerAmberLight.position.set(0.5, -0.2, 0.8);
            scene.add(beerAmberLight);

            // LIVEPHOTO用キャンバス生成
            setupLivePhotoCanvas();

            const width = 1.0;
            const height = 1.35;

            // 高密度メッシュ
            page1Geo = new THREE.PlaneGeometry(width, height, 64, 64);
            page1Geo.translate(width / 2, 0, 0);
            origPositions = page1Geo.attributes.position.clone();

            page1Texture = createMainichiPage1Texture();
            page2Texture = createMainichiPage2Texture();

            const mat1 = new THREE.MeshStandardMaterial({
                map: page1Texture,
                side: THREE.DoubleSide,
                roughness: 0.25,
                metalness: 0.05
            });

            page1Mesh = new THREE.Mesh(page1Geo, mat1);
            page1Mesh.renderOrder = 2;

            // 2面（固定待機面）
            const bgGeo = new THREE.PlaneGeometry(width, height);
            bgGeo.translate(width / 2, 0, 0);
            const mat2 = new THREE.MeshStandardMaterial({
                map: page2Texture,
                side: THREE.DoubleSide,
                roughness: 0.25,
                metalness: 0.05
            });
            backgroundPageMesh = new THREE.Mesh(bgGeo, mat2);
            backgroundPageMesh.position.z = -0.02;
            backgroundPageMesh.renderOrder = 1;

            const hologramStage = new THREE.Group();
            hologramStage.rotation.x = 0.18;
            hologramStage.rotation.y = -0.22;
            hologramStage.position.set(-0.45, 0, 0);
            scene.add(hologramStage);

            hologramStage.add(page1Mesh);
            hologramStage.add(backgroundPageMesh);

            // ==========================================
            // キンキンに冷えた 3D生ビール缶 ＋ 氷結・冷気演出
            // ==========================================
            beerCanGroup = new THREE.Group();
            beerCanGroup.position.set(0.68, -0.35, 0.05);
            backgroundPageMesh.add(beerCanGroup);

            // 缶本体（リアルメタリック）
            const canGeo = new THREE.CylinderGeometry(0.06, 0.06, 0.19, 32);
            const canMat = new THREE.MeshStandardMaterial({
                color: 0x111111,
                metalness: 0.95,
                roughness: 0.08
            });
            beerCanMesh = new THREE.Mesh(canGeo, canMat);
            beerCanGroup.add(beerCanMesh);

            // 金星マーク
            const starGeo = new THREE.OctahedronGeometry(0.028);
            const starMat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.8, roughness: 0.2 });
            const starMesh = new THREE.Mesh(starGeo, starMat);
            starMesh.position.set(0, 0.015, 0.061);
            starMesh.scale.set(1, 1, 0.2);
            beerCanGroup.add(starMesh);

            // 氷結パーティクル（缶の周囲を舞う氷の結晶）
            const particleCount = 60;
            const particleGeo = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            for (let i = 0; i < particleCount * 3; i += 3) {
                positions[i] = (Math.random() - 0.5) * 0.3;
                positions[i + 1] = (Math.random() - 0.5) * 0.3;
                positions[i + 2] = (Math.random() - 0.5) * 0.3;
            }
            particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const particleMat = new THREE.PointsMaterial({
                color: 0x00e1ff,
                size: 0.012,
                transparent: true,
                opacity: 0.8
            });
            frostParticles = new THREE.Points(particleGeo, particleMat);
            beerCanGroup.add(frostParticles);

            // イベント登録
            window.addEventListener('mousedown', onMouseDown);
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('mouseup', onMouseUp);
            window.addEventListener('touchstart', onTouchStart);
            window.addEventListener('touchmove', onTouchMove);
            window.addEventListener('touchend', onMouseUp);
            window.addEventListener('resize', onWindowResize);

            renderer.setAnimationLoop(render);
        }

        // ==========================================
        // LIVEPHOTO（動くグラフィック記事）用キャンバス
        // ==========================================
        function setupLivePhotoCanvas() {
            livePhotoCanvas = document.createElement('canvas');
            livePhotoCanvas.width = 1024;
            livePhotoCanvas.height = 600;
            livePhotoCtx = livePhotoCanvas.getContext('2d');
            livePhotoTexture = new THREE.CanvasTexture(livePhotoCanvas);
        }

        function updateLivePhotoCanvas() {
            livePhotoAnimTime += 0.03;
            const w = livePhotoCanvas.width;
            const h = livePhotoCanvas.height;

            // 背景サイバー空間
            livePhotoCtx.fillStyle = '#001a0f';
            livePhotoCtx.fillRect(0, 0, w, h);

            // 動的な波紋・ホログラムグリッドを描画（LIVEPHOTO演出）
            livePhotoCtx.strokeStyle = '#00ff88';
            livePhotoCtx.lineWidth = 3;
            for (let i = 0; i < 5; i++) {
                const radius = ((livePhotoAnimTime * 60 + i * 80) % 500);
                const alpha = 1 - (radius / 500);
                livePhotoCtx.strokeStyle = `rgba(0, 255, 136, ${alpha})`;
                livePhotoCtx.beginPath();
                livePhotoCtx.arc(w / 2, h / 2, radius, 0, Math.PI * 2);
                livePhotoCtx.stroke();
            }

            // 動的テクスチャテキスト
            livePhotoCtx.fillStyle = '#ffffff';
            livePhotoCtx.font = 'bold 42px sans-serif';
            livePhotoCtx.fillText('【LIVE PHOTO】リアルタイムAIデータ通信中...', 60, 100);

            // アニメーションバー
            const barW = (Math.sin(livePhotoAnimTime * 2) * 0.5 + 0.5) * (w - 120);
            livePhotoCtx.fillStyle = '#00e1ff';
            livePhotoCtx.fillRect(60, h - 80, barW, 20);

            livePhotoTexture.needsUpdate = true;
        }

        // ==========================================
        // 1面テクスチャ（LIVEPHOTO枠を埋め込み）
        // ==========================================
        function createMainichiPage1Texture() {
            const canvas = document.createElement('canvas');
            canvas.width = 2048; canvas.height = 2048;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#000000'; ctx.fillRect(0, 0, 2048, 2048);
            ctx.strokeStyle = '#00ff88'; ctx.lineWidth = 8; ctx.strokeRect(20, 20, 2008, 2008);

            // 題字
            ctx.fillStyle = '#00331a'; ctx.fillRect(1520, 50, 470, 280);
            ctx.strokeStyle = '#00ff88'; ctx.lineWidth = 4; ctx.strokeRect(1520, 50, 470, 280);
            ctx.fillStyle = '#00ff88'; ctx.font = 'bold 110px "Hiragino Mincho ProN", serif';
            ctx.fillText('毎', 1780, 160); ctx.fillText('日', 1780, 280);
            ctx.fillText('新', 1610, 160); ctx.fillText('聞', 1610, 280);

            ctx.fillStyle = '#ffffff'; ctx.font = '24px sans-serif';
            ctx.fillText('2026年 (令和8年) 9月22日 (火曜日)', 1530, 310);

            // 大見出し
            ctx.fillStyle = '#00ff88'; ctx.font = 'bold 76px serif';
            ctx.fillText('毎日新聞 3Dホログラム版 実証実験', 100, 160);

            // LIVEPHOTO組み込み位置を示す枠
            ctx.strokeStyle = '#00e1ff'; ctx.lineWidth = 6;
            ctx.strokeRect(100, 320, 1350, 750);
            ctx.fillStyle = '#001a10'; ctx.fillRect(100, 320, 1350, 750);

            ctx.fillStyle = '#00ff88'; ctx.font = 'bold 36px sans-serif';
            ctx.fillText('▲ 次世代ホログラムLIVE PHOTOメディア枠', 120, 370);

            // 縦組み本文風ライン
            ctx.strokeStyle = '#005533'; ctx.lineWidth = 2;
            for (let x = 1900; x > 100; x -= 40) {
                ctx.beginPath(); ctx.moveTo(x, 1120); ctx.lineTo(x, 1950); ctx.stroke();
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
            return tex;
        }

        function createMainichiPage2Texture() {
            const canvas = document.createElement('canvas');
            canvas.width = 2048; canvas.height = 2048;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#000000'; ctx.fillRect(0, 0, 2048, 2048);
            ctx.strokeStyle = '#00ff88'; ctx.lineWidth = 8; ctx.strokeRect(20, 20, 2008, 2008);

            ctx.fillStyle = '#00331a'; ctx.fillRect(50, 50, 1940, 90);
            ctx.strokeStyle = '#00ff88'; ctx.lineWidth = 4; ctx.strokeRect(50, 50, 1940, 90);

            ctx.fillStyle = '#00ff88'; ctx.font = 'bold 50px "Hiragino Mincho ProN", serif';
            ctx.fillText('毎日新聞', 80, 115);
            ctx.font = 'bold 35px sans-serif'; ctx.fillText('総合・社会 ２面', 1680, 110);

            ctx.fillStyle = '#00ff88'; ctx.font = 'bold 68px serif';
            ctx.fillText('特定技能制度の最新運用動向と支援体制', 100, 240);

            ctx.strokeStyle = '#005533'; ctx.lineWidth = 2;
            for (let x = 1900; x > 100; x -= 38) {
                ctx.beginPath(); ctx.moveTo(x, 280); ctx.lineTo(x, 1300); ctx.stroke();
            }

            // 超極冷ビール 広告エリア
            ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 8;
            ctx.strokeRect(100, 1350, 1850, 640);
            ctx.fillStyle = '#05120a'; ctx.fillRect(100, 1350, 1850, 640);

            ctx.fillStyle = '#ffd700'; ctx.font = 'bold 60px serif';
            ctx.fillText('★ SAPPORO　生ビール 黒ラベル 【超極冷】', 150, 1440);
            ctx.fillStyle = '#00ffff'; ctx.font = '32px sans-serif';
            ctx.fillText('丸くなるな、星になれ。［ 氷結シズル 3D立体飛び出し広告 ］', 150, 1520);

            const tex = new THREE.CanvasTexture(canvas);
            tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
            return tex;
        }

        // ==========================================
        // 高精度対角しなり（Page Curl）物理計算
        // ==========================================
        function applyPageCurl(geo, progress) {
            const pos = geo.attributes.position;
            const count = pos.count;

            const theta = progress * Math.PI;
            const radius = 0.32 + 0.18 * Math.sin(theta);

            for (let i = 0; i < count; i++) {
                const x = origPositions.getX(i);
                const y = origPositions.getY(i);

                if (x === 0) {
                    pos.setXYZ(i, 0, y, 0);
                    continue;
                }

                const curlPoint = (1 - progress) * 1.0;

                if (x < curlPoint) {
                    pos.setXYZ(i, x, y, 0);
                } else {
                    const dist = x - curlPoint;
                    const angle = dist / radius;

                    const newX = curlPoint + radius * Math.sin(angle);
                    const newZ = radius * (1 - Math.cos(angle));

                    // しなやかな三次元曲面（対角カーブの物理計算）
                    const rotX = curlPoint - (newX - curlPoint) * Math.cos(theta) - newZ * Math.sin(theta);
                    const rotZ = (newX - curlPoint) * Math.sin(theta) + newZ * Math.cos(theta) + (0.2 * Math.sin(theta) * (y + 0.7));

                    pos.setXYZ(i, rotX, y, rotZ);
                }
            }

            pos.needsUpdate = true;
            geo.computeVertexNormals();
        }

        function onMouseDown(e) { isDragging = true; }
        function onMouseUp(e) {
            isDragging = false;
            targetProgress = dragProgress > 0.5 ? 1 : 0;
        }

        function onMouseMove(e) {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            if (isDragging) {
                targetProgress = Math.max(0, Math.min(1, (0.5 - mouse.x)));
            }
        }

        function onTouchStart(e) {
            if (e.touches.length > 0) {
                isDragging = true;
                mouse.x = (e.touches[0].clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.touches[0].clientY / window.innerHeight) * 2 + 1;
            }
        }

        function onTouchMove(e) {
            if (isDragging && e.touches.length > 0) {
                mouse.x = (e.touches[0].clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.touches[0].clientY / window.innerHeight) * 2 + 1;
                targetProgress = Math.max(0, Math.min(1, (0.5 - mouse.x)));
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function render() {
            dragProgress += (targetProgress - dragProgress) * 0.1;

            // LIVEPHOTOのリアルタイム更新
            updateLivePhotoCanvas();

            // しなやかなページめくり計算
            applyPageCurl(page1Geo, dragProgress);

            // 2面表示時のキンキンに冷えたビール缶ダイナミックジャンプ演出
            const sizzleCaption = document.getElementById('sizzle-caption');
            if (dragProgress > 0.45) {
                sizzleCaption.style.opacity = '1';

                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObject(beerCanMesh);
                isAdHovered = intersects.length > 0;

                // 目の前まで飛び出すダイナミックZ軸移動（最大0.75m飛び出し）
                const targetScale = isAdHovered ? 2.8 : 1.6;
                const targetZ = isAdHovered ? 0.75 : 0.35;

                beerCanGroup.scale.lerp(new THREE.Vector3(targetScale, targetScale, targetScale), 0.08);
                beerCanGroup.position.z += (targetZ - beerCanGroup.position.z) * 0.08;

                // 缶の回転と氷結パーティクル回転
                beerCanMesh.rotation.y += isAdHovered ? 0.05 : 0.015;
                frostParticles.rotation.y -= 0.02;
                frostParticles.rotation.z += 0.01;
            } else {
                sizzleCaption.style.opacity = '0';
                beerCanGroup.position.z = 0.05;
                beerCanGroup.scale.set(1.0, 1.0, 1.0);
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
