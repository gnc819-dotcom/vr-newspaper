<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Holographic Newspaper</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000000; /* 漆黒RGB: 0,0,0 */
            font-family: sans-serif;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
        }
        #info-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00ff88;
            font-family: monospace;
            font-size: 14px;
            pointer-events: none;
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            padding: 12px 18px;
            border-radius: 8px;
            border: 1px solid #00ff88;
        }
        #vr-button {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            border: 1px solid #fff;
            border-radius: 4px;
            background: rgba(0,0,0,0.8);
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            z-index: 999;
        }
    </style>
    <!-- Three.js Bundle (外部通信なし) -->
    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
</head>
<body>
    <div id="info-overlay">
        <div>[3D Hologram Newspaper]</div>
        <div>- Click / Press Trigger to Turn Page</div>
        <div>- Local Standalone Mode</div>
    </div>
    <button id="vr-button">START VR</button>
    <div id="canvas-container"></div>

    <script>
        // --- 1. Base64 画像データ格納部 ---
        const BASE64_PAGE_1 = ""; // 1ページ目 (表) Base64データ
        const BASE64_PAGE_2 = ""; // 2ページ目 (裏) Base64データ

        // --- 2. ダミー新聞テクスチャ生成 ---
        function createFallbackNewspaperTexture(pageNumber, titleText) {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1024; // 1:1 比率
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#f4f1ea';
            ctx.fillRect(0, 0, 1024, 1024);

            ctx.fillStyle = '#111111';
            ctx.fillRect(40, 40, 944, 100);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 52px serif';
            ctx.textAlign = 'center';
            ctx.fillText(titleText, 512, 110);

            ctx.fillStyle = '#ff0055';
            ctx.font = 'bold 36px monospace';
            ctx.fillText(`- PAGE ${pageNumber} -`, 512, 180);

            ctx.fillStyle = '#333333';
            ctx.strokeStyle = '#cccccc';
            ctx.lineWidth = 2;

            for (let col = 0; col < 3; col++) {
                const x = 60 + col * 310;
                ctx.strokeRect(x, 220, 290, 740);
                ctx.fillStyle = '#222222';
                ctx.fillRect(x + 10, 240, 270, 40);
                ctx.fillStyle = '#666666';
                for (let line = 0; line < 25; line++) {
                    ctx.fillRect(x + 10, 300 + line * 26, 270, 10);
                }
            }

            const texture = new THREE.CanvasTexture(canvas);
            return texture;
        }

        // --- 3. メインシーン初期化 ---
        let scene, camera, renderer;
        let pageGeometry, frontMesh, backMesh;
        let isFlipped = false;
        let isAnimating = false;
        let animationProgress = 0;

        const width = 1.2;
        const height = 1.2; // 1:1比率
        const segX = 60;
        const segY = 30;

        init();
        animate();

        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000); // 漆黒

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 1.2, 1.8);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.xr.enabled = true;
            container.appendChild(renderer.domElement);

            // ライティング
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(2, 4, 3);
            scene.add(dirLight);

            // テクスチャ設定
            const textureLoader = new THREE.TextureLoader();
            const frontTexture = BASE64_PAGE_1 ? textureLoader.load(BASE64_PAGE_1) : createFallbackNewspaperTexture(1, "毎日新聞 - 表紙");
            const backTexture = BASE64_PAGE_2 ? textureLoader.load(BASE64_PAGE_2) : createFallbackNewspaperTexture(2, "毎日新聞 - 2面");

            // ジオメトリ（メッシュ分割）
            pageGeometry = new THREE.PlaneGeometry(width, height, segX, segY);
            pageGeometry.translate(width / 2, 0, 0); // 左端軸

            const group = new THREE.Group();
            group.position.set(-width / 2, 1.2, 0);
            scene.add(group);

            const frontMaterial = new THREE.MeshStandardMaterial({ map: frontTexture, side: THREE.FrontSide, roughness: 0.5 });
            const backMaterial = new THREE.MeshStandardMaterial({ map: backTexture, side: THREE.FrontSide, roughness: 0.5 });

            frontMesh = new THREE.Mesh(pageGeometry, frontMaterial);
            group.add(frontMesh);

            backMesh = new THREE.Mesh(pageGeometry, backMaterial);
            backMesh.rotation.y = Math.PI;
            group.add(backMesh);

            // VR ボタン設定
            const vrBtn = document.getElementById('vr-button');
            if ('xr' in navigator) {
                navigator.xr.isSessionSupported('immersive-vr').then((supported) => {
                    if (supported) {
                        vrBtn.addEventListener('click', () => {
                            navigator.xr.requestSession('immersive-vr').then((session) => {
                                renderer.xr.setSession(session);
                                vrBtn.style.display = 'none';
                            });
                        });
                    } else {
                        vrBtn.textContent = 'VR NOT SUPPORTED';
                    }
                });
            }

            // 操作イベント
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('pointerdown', startFlip);

            // コントローラー
            const controller1 = renderer.xr.getController(0);
            controller1.addEventListener('selectstart', startFlip);
            scene.add(controller1);

            const controller2 = renderer.xr.getController(1);
            controller2.addEventListener('selectstart', startFlip);
            scene.add(controller2);
        }

        function startFlip() {
            if (isAnimating) return;
            isAnimating = true;
        }

        function updatePaperDeformation(progress) {
            const positionAttribute = pageGeometry.attributes.position;
            const angle = progress * Math.PI;
            const curlAmount = Math.sin(progress * Math.PI); // めくり時のしなやかさ

            for (let i = 0; i < positionAttribute.count; i++) {
                const x = (i % (segX + 1)) * (width / segX);
                const normalizedX = x / width;

                const curlOffset = Math.sin(normalizedX * Math.PI) * curlAmount * 0.18;

                const currentX = x * Math.cos(angle) + curlOffset * Math.sin(angle);
                const currentZ = -x * Math.sin(angle) + curlOffset * Math.cos(angle);

                positionAttribute.setXYZ(i, currentX, positionAttribute.getY(i), currentZ);
            }

            positionAttribute.needsUpdate = true;
            pageGeometry.computeVertexNormals();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            renderer.setAnimationLoop(render);
        }

        function render() {
            if (isAnimating) {
                if (!isFlipped) {
                    animationProgress += 0.02;
                    if (animationProgress >= 1) {
                        animationProgress = 1;
                        isAnimating = false;
                        isFlipped = true;
                    }
                } else {
                    animationProgress -= 0.02;
                    if (animationProgress <= 0) {
                        animationProgress = 0;
                        isAnimating = false;
                        isFlipped = false;
                    }
                }
                updatePaperDeformation(animationProgress);
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
