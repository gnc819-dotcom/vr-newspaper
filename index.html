<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Mainichi Shimbun - Flexible Page Curl</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000000;
            font-family: serif;
        }
        #info-ui {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            color: #00ff88;
            font-family: sans-serif;
            font-size: 16px;
            background: rgba(0,0,0,0.85);
            padding: 12px 25px;
            border: 2px solid #00ff88;
            border-radius: 30px;
            pointer-events: none;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
            z-index: 100;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="info-ui">新聞の右端をクリック／タップしてドラッグすると、紙がしなやかにめくります</div>

    <script>
        let scene, camera, renderer;
        let page1Mesh, page2Mesh;
        let page1Geo, page2Geo;
        let origPositions;
        
        let isDragging = false;
        let dragProgress = 0; // 0 (1面) 〜 1 (2面)
        let targetProgress = 0;

        let beerCanGroup, beerCanMesh, pulseRing;
        let raycaster, mouse;
        let isAdHovered = false;

        init();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000); // 漆黒 RGB:0,0,0

            // 3D立体感を強力に表現する斜めカメラアングル
            camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 0.15, 2.4);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2.0));
            document.body.appendChild(renderer.domElement);

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2(-100, -100);

            // 多方向立体ライティング
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
            scene.add(ambientLight);

            const greenSpot = new THREE.SpotLight(0x00ff88, 3.0);
            greenSpot.position.set(3, 4, 3);
            scene.add(greenSpot);

            const bluePoint = new THREE.PointLight(0x00e1ff, 2.5, 10);
            bluePoint.position.set(-3, -2, 2);
            scene.add(bluePoint);

            // 高密度メッシュ（64x64分割）による完全な物理曲げ計算
            const width = 1.0;
            const height = 1.35;
            page1Geo = new THREE.PlaneGeometry(width, height, 64, 64);
            page1Geo.translate(width / 2, 0, 0); // 左端をめくり軸に設定

            page2Geo = new THREE.PlaneGeometry(width, height, 64, 64);
            page2Geo.translate(width / 2, 0, 0);

            origPositions = page1Geo.attributes.position.clone();

            const tex1 = createMainichiPage1Texture();
            const tex2 = createMainichiPage2Texture();

            const mat1 = new THREE.MeshStandardMaterial({ map: tex1, side: THREE.FrontSide, roughness: 0.25, metalness: 0.05 });
            const mat2 = new THREE.MeshStandardMaterial({ map: tex2, side: THREE.BackSide, roughness: 0.25, metalness: 0.05 });

            page1Mesh = new THREE.Mesh(page1Geo, mat1);
            page2Mesh = new THREE.Mesh(page2Geo, mat2);

            // 3Dステージ（空間にわずかに傾けて浮かせる）
            const hologramStage = new THREE.Group();
            hologramStage.rotation.x = 0.15;
            hologramStage.rotation.y = -0.12;
            hologramStage.position.set(-0.48, 0, 0);
            scene.add(hologramStage);

            hologramStage.add(page1Mesh);
            hologramStage.add(page2Mesh);

            // 2面 下部 3D立体缶（サッポロ黒ラベル）
            beerCanGroup = new THREE.Group();
            beerCanGroup.position.set(0.68, -0.35, -0.05);
            page2Mesh.add(beerCanGroup);

            const canGeo = new THREE.CylinderGeometry(0.055, 0.055, 0.17, 32);
            const canMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.9, roughness: 0.1 });
            beerCanMesh = new THREE.Mesh(canGeo, canMat);
            beerCanGroup.add(beerCanMesh);

            const starGeo = new THREE.OctahedronGeometry(0.024);
            const starMat = new THREE.MeshBasicMaterial({ color: 0xffd700 });
            const starMesh = new THREE.Mesh(starGeo, starMat);
            starMesh.position.set(0, 0.01, -0.056);
            starMesh.scale.set(1, 1, 0.2);
            beerCanGroup.add(starMesh);

            const ringGeo = new THREE.RingGeometry(0.065, 0.085, 32);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0x00e1ff, side: THREE.DoubleSide, transparent: true, opacity: 0.5 });
            pulseRing = new THREE.Mesh(ringGeo, ringMat);
            pulseRing.rotation.x = Math.PI / 2;
            pulseRing.position.y = -0.085;
            beerCanGroup.add(pulseRing);

            // 操作イベント
            window.addEventListener('mousedown', onMouseDown);
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('mouseup', onMouseUp);
            window.addEventListener('touchstart', onTouchStart);
            window.addEventListener('touchmove', onTouchMove);
            window.addEventListener('touchend', onMouseUp);
            window.addEventListener('resize', onWindowResize);

            renderer.setAnimationLoop(render);
        }

        function createMainichiPage1Texture() {
            const canvas = document.createElement('canvas');
            canvas.width = 2048; canvas.height = 2048;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#000000'; ctx.fillRect(0, 0, 2048, 2048);
            ctx.strokeStyle = '#00ff88'; ctx.lineWidth = 8; ctx.strokeRect(20, 20, 2008, 2008);

            ctx.fillStyle = '#00331a'; ctx.fillRect(1520, 50, 470, 280);
            ctx.strokeStyle = '#00ff88'; ctx.lineWidth = 4; ctx.strokeRect(1520, 50, 470, 280);
            
            ctx.fillStyle = '#00ff88'; ctx.font = 'bold 110px "Hiragino Mincho ProN", serif';
            ctx.fillText('毎', 1780, 160); ctx.fillText('日', 1780, 280);
            ctx.fillText('新', 1610, 160); ctx.fillText('聞', 1610, 280);

            ctx.fillStyle = '#ffffff'; ctx.font = '24px sans-serif';
            ctx.fillText('2026年 (令和8年) 9月22日 (火曜日)', 1530, 310);

            ctx.fillStyle = '#00ff88'; ctx.font = 'bold 76px serif';
            ctx.fillText('毎日新聞 3Dホログラム版 実証実験', 100, 160);

            ctx.strokeStyle = '#005533'; ctx.lineWidth = 2;
            for(let x = 1450; x > 100; x -= 40) {
                ctx.beginPath(); ctx.moveTo(x, 350); ctx.lineTo(x, 1950); ctx.stroke();
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
            return tex;
        }

        function createMainichiPage2Texture() {
            const canvas = document.createElement('canvas');
            canvas.width = 2048; canvas.height = 2048;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#000000'; ctx.fillRect(0, 0, 2048, 2048);
            ctx.strokeStyle = '#00ff88'; ctx.lineWidth = 8; ctx.strokeRect(20, 20, 2008, 2008);

            ctx.fillStyle = '#00331a'; ctx.fillRect(50, 50, 1940, 90);
            ctx.strokeStyle = '#00ff88'; ctx.lineWidth = 4; ctx.strokeRect(50, 50, 1940, 90);

            ctx.fillStyle = '#00ff88'; ctx.font = 'bold 50px "Hiragino Mincho ProN", serif';
            ctx.fillText('毎日新聞', 80, 115);
            ctx.font = 'bold 35px sans-serif'; ctx.fillText('総合・社会 ２面', 1680, 110);

            ctx.fillStyle = '#00ff88'; ctx.font = 'bold 68px serif';
            ctx.fillText('特定技能制度の最新運用動向と支援体制', 100, 240);

            ctx.strokeStyle = '#005533'; ctx.lineWidth = 2;
            for(let x = 1900; x > 100; x -= 38) {
                ctx.beginPath(); ctx.moveTo(x, 280); ctx.lineTo(x, 1320); ctx.stroke();
            }

            ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 6;
            ctx.strokeRect(100, 1350, 1850, 640);
            ctx.fillStyle = '#05100a'; ctx.fillRect(100, 1350, 1850, 640);

            ctx.fillStyle = '#ffd700'; ctx.font = 'bold 55px serif';
            ctx.fillText('★ SAPPORO 生ビール 黒ラベル', 150, 1440);
            ctx.fillStyle = '#ffffff'; ctx.font = '30px sans-serif';
            ctx.fillText('丸くなるな、星になれ。［ 3D立体ポップアップ広告 ］', 150, 1520);

            const tex = new THREE.CanvasTexture(canvas);
            tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
            return tex;
        }

        // 高精度な紙の曲げ（Curl/Bend）頂点変形計算
        function applyPageCurl(geo, progress) {
            const pos = geo.attributes.position;
            const count = pos.count;

            const theta = progress * Math.PI;
            const radius = 0.32 + 0.18 * Math.sin(theta); // 進行度に応じたしなり円弧半径

            for (let i = 0; i < count; i++) {
                const x = origPositions.getX(i);
                const y = origPositions.getY(i);

                if (x === 0) {
                    pos.setXYZ(i, 0, y, 0);
                    continue;
                }

                const curlPoint = (1 - progress) * 1.0;

                if (x < curlPoint) {
                    pos.setXYZ(i, x, y, 0);
                } else {
                    const dist = x - curlPoint;
                    const angle = dist / radius;

                    const newX = curlPoint + radius * Math.sin(angle);
                    const newZ = radius * (1 - Math.cos(angle));

                    const rotX = curlPoint - (newX - curlPoint) * Math.cos(theta) - newZ * Math.sin(theta);
                    const rotZ = (newX - curlPoint) * Math.sin(theta) + newZ * Math.cos(theta);

                    pos.setXYZ(i, rotX, y, rotZ);
                }
            }

            pos.needsUpdate = true;
            geo.computeVertexNormals();
        }

        function onMouseDown(e) { isDragging = true; }
        function onMouseUp(e) {
            isDragging = false;
            targetProgress = dragProgress > 0.5 ? 1 : 0;
        }

        function onMouseMove(e) {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            if (isDragging) {
                targetProgress = Math.max(0, Math.min(1, (0.5 - mouse.x)));
            }
        }

        function onTouchStart(e) {
            if (e.touches.length > 0) {
                isDragging = true;
                mouse.x = (e.touches[0].clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.touches[0].clientY / window.innerHeight) * 2 + 1;
            }
        }

        function onTouchMove(e) {
            if (isDragging && e.touches.length > 0) {
                mouse.x = (e.touches[0].clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.touches[0].clientY / window.innerHeight) * 2 + 1;
                targetProgress = Math.max(0, Math.min(1, (0.5 - mouse.x)));
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function render() {
            dragProgress += (targetProgress - dragProgress) * 0.1;

            applyPageCurl(page1Geo, dragProgress);
            applyPageCurl(page2Geo, dragProgress);

            if (dragProgress > 0.6) {
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObject(beerCanMesh);
                isAdHovered = intersects.length > 0;

                const targetScale = isAdHovered ? 2.3 : 1.0;
                const targetZ = isAdHovered ? -0.35 : -0.05;

                beerCanGroup.scale.lerp(new THREE.Vector3(targetScale, targetScale, targetScale), 0.1);
                beerCanGroup.position.z += (targetZ - beerCanGroup.position.z) * 0.1;

                if (isAdHovered) {
                    beerCanMesh.rotation.y += 0.04;
                    pulseRing.material.opacity = 0.9;
                    pulseRing.scale.set(1.8, 1.8, 1.8);
                } else {
                    beerCanMesh.rotation.y += 0.005;
                    pulseRing.material.opacity = 0.3;
                    pulseRing.scale.set(1.0, 1.0, 1.0);
                }
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
