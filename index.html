<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Holographic Newspaper</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000000; /* 漆黒 RGB: 0,0,0 */
            font-family: sans-serif;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
        }
        #vr-button {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 16px 32px;
            border: 2px solid #00ff88;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.9);
            color: #00ff88;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            z-index: 999;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.5);
        }
    </style>
    <!-- Three.js 安定版ライブラリ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <button id="vr-button">START VR (3D表示)</button>
    <div id="canvas-container"></div>

    <script>
        let scene, camera, renderer;
        let newspaperGroup, pageMesh;
        let isAnimating = false;

        // 物理仕様: 1:1 比率 (1.0m x 1.0m)
        const size = 1.0; 

        init();
        animate();

        function init() {
            const container = document.getElementById('canvas-container');

            // 1. シーン構築 (漆黒背景)
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);

            // 2. カメラ設定
            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 1.2, 1.5);

            // 3. レンダラー設定
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.xr.enabled = true;
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // 4. ライティング（3D陰影の強調）
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
            dirLight.position.set(1, 2, 2);
            dirLight.castShadow = true;
            scene.add(dirLight);

            const pointLight = new THREE.PointLight(0x00ff88, 2, 3);
            pointLight.position.set(-0.8, 1.5, 0.5);
            scene.add(pointLight);

            // 5. 3D新聞構造体の構築
            newspaperGroup = new THREE.Group();
            newspaperGroup.position.set(0, 1.2, -0.5); // 目の前50cmに配置
            scene.add(newspaperGroup);

            // ① 新聞の台座（厚みのある3D構造）
            const baseGeo = new THREE.BoxGeometry(size, size, 0.02); // 20mmの厚み
            const baseMat = new THREE.MeshStandardMaterial({ color: 0x151518, roughness: 0.5 });
            pageMesh = new THREE.Mesh(baseGeo, baseMat);
            pageMesh.castShadow = true;
            newspaperGroup.add(pageMesh);

            // ② 飛び出す「毎日新聞」立体見出し（前面へ4cm突起）
            const titleGeo = new THREE.BoxGeometry(size * 0.9, 0.18, 0.04);
            const titleMat = new THREE.MeshStandardMaterial({ color: 0x00ff88, metalness: 0.3, roughness: 0.2 });
            const titleMesh = new THREE.Mesh(titleGeo, titleMat);
            titleMesh.position.set(0, size * 0.35, 0.03);
            newspaperGroup.add(titleMesh);

            // ③ 3Dホログラム写真エリア（前面へ6cm突起）
            const photoGeo = new THREE.BoxGeometry(size * 0.42, size * 0.42, 0.06);
            const photoMat = new THREE.MeshStandardMaterial({ color: 0x00aeff, roughness: 0.1 });
            const photoMesh = new THREE.Mesh(photoGeo, photoMat);
            photoMesh.position.set(-size * 0.22, -0.05, 0.04);
            newspaperGroup.add(photoMesh);

            // ④ 記事コラム（立体ラインレイヤー）
            for (let i = 0; i < 7; i++) {
                const lineGeo = new THREE.BoxGeometry(size * 0.4, 0.025, 0.015);
                const lineMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
                const lineMesh = new THREE.Mesh(lineGeo, lineMat);
                lineMesh.position.set(size * 0.22, size * 0.15 - i * 0.055, 0.02);
                newspaperGroup.add(lineMesh);
            }

            // ⑤ 空間の立体視を強調するホログラムリング
            const ringGeo = new THREE.TorusGeometry(0.8, 0.005, 16, 100);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0x00ff88, wireframe: true });
            const ringMesh = new THREE.Mesh(ringGeo, ringMat);
            ringMesh.rotation.x = Math.PI / 2;
            ringMesh.position.set(0, -size * 0.5 - 0.1, 0);
            newspaperGroup.add(ringMesh);

            // 6. WebXR (VR) 起動処理
            const vrBtn = document.getElementById('vr-button');
            if ('xr' in navigator) {
                navigator.xr.isSessionSupported('immersive-vr').then((supported) => {
                    if (supported) {
                        vrBtn.addEventListener('click', () => {
                            navigator.xr.requestSession('immersive-vr').then((session) => {
                                renderer.xr.setSession(session);
                                vrBtn.style.display = 'none';
                            });
                        });
                    } else {
                        vrBtn.textContent = 'VR未対応ブラウザです';
                    }
                });
            }

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('pointerdown', startInteraction);

            const c1 = renderer.xr.getController(0);
            c1.addEventListener('selectstart', startInteraction);
            scene.add(c1);

            const c2 = renderer.xr.getController(1);
            c2.addEventListener('selectstart', startInteraction);
            scene.add(c2);
        }

        function startInteraction() {
            isAnimating = true;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            renderer.setAnimationLoop(render);
        }

        function render() {
            // タップまたはトリガーで3D新聞がゆったり回転し、立体の深み（両眼視差）を体感
            if (isAnimating && newspaperGroup) {
                newspaperGroup.rotation.y += 0.02;
                if (newspaperGroup.rotation.y >= Math.PI * 2) {
                    newspaperGroup.rotation.y = 0;
                    isAnimating = false;
                }
            }
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
