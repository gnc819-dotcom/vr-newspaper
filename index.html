<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Hologram Newspaper - High Density Text Edition</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000000;
            font-family: sans-serif;
        }
        #vr-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 1000;
        }
        .btn-vr {
            padding: 20px 40px;
            font-size: 22px;
            font-weight: bold;
            color: #00ff88;
            background: #000000;
            border: 3px solid #00ff88;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.8);
        }
        .btn-vr:hover {
            background: #00ff88;
            color: #000000;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FontLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/TextGeometry.js"></script>
</head>
<body>
    <div id="vr-overlay">
        <button id="enter-vr-btn" class="btn-vr">VRモード起動（新聞文字密度・完全再現版）</button>
    </div>

    <script>
        let scene, camera, renderer, newspaperGroup, photoCard;

        init();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000); // 漆黒 RGB:0,0,0

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 1.6, 1.0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0x00ff88, 2, 10);
            pointLight.position.set(0, 2, 0.5);
            scene.add(pointLight);

            newspaperGroup = new THREE.Group();
            newspaperGroup.position.set(0, 1.5, -1.0);
            scene.add(newspaperGroup);

            // ==========================================
            // 1. 高精細 2048x2048 Canvas（新聞紙面・超高密度テキスト描画）
            // ==========================================
            const paperCanvas = document.createElement('canvas');
            paperCanvas.width = 2048;
            paperCanvas.height = 2048;
            const ctx = paperCanvas.getContext('2d');

            // 漆黒背景
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, 2048, 2048);

            // 二重外枠
            ctx.strokeStyle = '#00ff88';
            ctx.lineWidth = 10;
            ctx.strokeRect(30, 30, 1988, 1988);
            ctx.lineWidth = 2;
            ctx.strokeRect(44, 44, 1960, 1960);

            // --- ヘッダー領域 ---
            // 題字ブロック（右上）
            ctx.fillStyle = '#00ff88';
            ctx.fillRect(1400, 60, 580, 200);
            ctx.fillStyle = '#000000';
            ctx.font = 'bold 88px "Hiragino Mincho ProN", "MS Mincho", serif';
            ctx.fillText('空間日報', 1510, 190);

            // 発行情報・日付（左上）
            ctx.fillStyle = '#00e1ff';
            ctx.font = '28px sans-serif';
            ctx.fillText('2026年 (令和8年) 9月22日 火曜日 【創刊号】', 60, 100);
            ctx.fillText('発行所：空間新聞社 3D HOLOGRAPHIC MEDIA LAB', 60, 140);
            ctx.fillText('規格：Q42 3D-Hologram Fan Compatible / 1024x1024 / 60fps', 60, 180);

            // ヘッダー下区切り線
            ctx.strokeStyle = '#00e1ff';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(60, 280);
            ctx.lineTo(1988, 280);
            ctx.stroke();

            // --- メイン大見出し（トップ記事） ---
            ctx.fillStyle = '#00ff88';
            ctx.font = 'bold 72px "Hiragino Sans", "Meiryo", sans-serif';
            ctx.fillText('3Dホログラム新聞、実用化へ始動', 60, 370);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 38px sans-serif';
            ctx.fillText('〜 WebXRと立体透過表示技術が融合、紙面から飛び出す新ニュース体験 〜', 60, 430);

            // 主線
            ctx.strokeStyle = '#00ff88';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(60, 470);
            ctx.lineTo(1988, 470);
            ctx.stroke();

            // --- 多段組（マルチカラム）高密度本文配置機能 ---
            // 汎用テキスト流し込み関数
            function fillColumnText(text, x, y, width, lineHeight, fontSize, color, maxLines) {
                ctx.fillStyle = color;
                ctx.font = `${fontSize}px sans-serif`;
                let chars = text.split('');
                let currentLine = '';
                let currentY = y;
                let lineCount = 0;

                for (let i = 0; i < chars.length; i++) {
                    let testLine = currentLine + chars[i];
                    let metrics = ctx.measureText(testLine);
                    if (metrics.width > width && i > 0) {
                        ctx.fillText(currentLine, x, currentY);
                        currentLine = chars[i];
                        currentY += lineHeight;
                        lineCount++;
                        if (maxLines && lineCount >= maxLines) break;
                    } else {
                        currentLine = testLine;
                    }
                }
                if (!maxLines || lineCount < maxLines) {
                    ctx.fillText(currentLine, x, currentY);
                }
                return currentY + lineHeight;
            }

            // サンプル長文データ
            const sampleArticleA = "空間メディア取材班の試算によると、3Dホログラムによる新しい情報提示手法は、従来の平面ディスプレイと比較してユーザーの記憶定着率を約四十パーセント以上向上させる効果が確認された。本プロジェクトでは、3Dホログラムファン等の光学機器を用い、漆黒の背景領域（RGB:0,0,0）を透過させることで、文字やグラフィックのみを浮遊表示させる特殊なレンダリング方式を採用している。これにより、視覚的な疲労を最小限に抑えつつ、直感的なニュース把握が可能となった。今後は各地の自動販売機や店頭、さらには家庭内の空間ディスプレイに向けて、リアルタイムでの速報配信システムを構築していく方針である。";
            
            const sampleArticleB = "労働基準法および各種法規制への完全適応を目指した次世代ガバナンスチェック機能も本システムのバックエンドに組み込まれる。自動化されたコンプライアンス管理ツールは、最新のデータ解析アルゴリズムを活用し、契約書面や各種手続きの整合性をリアルタイムで評価する。新聞メディアが持つ信頼性と、先端AI技術の融合により、正確かつ迅速な情報提供プラットフォームの確立を目指す。";

            const sampleArticleC = "【社説】立体空間におけるメディアの未来と課題。紙媒体が長年培ってきた「レイアウトによる情報の重み付け」は、デジタル空間においても極めて重要な要素である。ホログラム空間において単にテキストを表示するだけでなく、空間の奥行き（Z軸）を利用したプライオリティ表現が、これからのニュースデザインの標準となるだろう。";

            // --- カラム配置（下部全領域を4つの主要エリアに分割し、ぎっしり配置） ---

            // エリア1: 右側メイン詳細記事（2カラム）
            ctx.fillStyle = '#00e1ff';
            ctx.font = 'bold 30px sans-serif';
            ctx.fillText('【詳細分析】空間プレゼンテーションの技術的背景', 1040, 520);
            fillColumnText(sampleArticleA, 1040, 560, 440, 32, 20, '#cccccc', 22);
            fillColumnText(sampleArticleB, 1510, 560, 440, 32, 20, '#cccccc', 22);

            // カラム仕切り縦線
            ctx.strokeStyle = '#333333';
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(1490, 520); ctx.lineTo(1490, 1280); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(1010, 490); ctx.lineTo(1010, 1980); ctx.stroke();

            // エリア2: 中央ホログラムフォト予約領域（左下）
            // （フォトカードが重なる部分は透過考慮のレイアウト枠を設置）
            ctx.strokeStyle = '#00ff88';
            ctx.lineWidth = 2;
            ctx.strokeRect(60, 510, 920, 770);
            ctx.fillStyle = '#00ff88';
            ctx.font = '22px sans-serif';
            ctx.fillText('［ 3D HOLOGRAM PHOTO DISPLAY AREA ］', 80, 540);

            // 写真横の解説記事
            fillColumnText("【写真解説】立体浮遊する報道フォトカード。最前面（Z:+12cm）に配置された3Dカードは、光の脈動とともにリアルタイムでアニメーションを行う。紙面から立体的に飛び出すことで、視覚的インパクトを最大化する設計となっている。", 560, 580, 400, 30, 19, '#aaaaaa', 22);

            // エリア3: 紙面下部（5コラム編成の密集ニュース街）
            ctx.strokeStyle = '#00e1ff';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(60, 1310); ctx.lineTo(1988, 1310); ctx.stroke();

            ctx.fillStyle = '#00ff88';
            ctx.font = 'bold 32px sans-serif';
            ctx.fillText('【空間総合面】各種動向および次世代テクノロジー速報', 60, 1360);

            // 下部 4カラム高密度テキスト充填
            const colWidth = 440;
            fillColumnText("【技術検証】Q42ホログラムファンにおける60fps同期レンダリングの最適化実験が完了。残像感を極限まで低減した鮮明な描画を実現。", 60, 1410, colWidth, 28, 18, '#bbbbbb', 18);
            fillColumnText("【地域経済】地方自治体におけるデジタルサイネージのホログラム化構想が浮上。観光案内や防災情報の立体表示など幅広い活用が期待される。", 540, 1410, colWidth, 28, 18, '#bbbbbb', 18);
            fillColumnText(sampleArticleC, 1040, 1410, colWidth, 28, 18, '#bbbbbb', 18);
            fillColumnText("【国際動向】WebXR標準化仕様の策定が進む中、立体新聞フォーマットの互換性確保に向けた業界団体の設立が提案された。各国のメディア企業が関心を寄せる。", 1520, 1410, colWidth, 28, 18, '#bbbbbb', 18);

            // 下部縦仕切り線
            for(let x = 510; x < 1900; x += 480) {
                ctx.beginPath(); ctx.moveTo(x, 1380); ctx.lineTo(x, 1980); ctx.stroke();
            }

            // 最下部フッターフチ
            ctx.fillStyle = '#00ff88';
            ctx.fillRect(60, 1990, 1928, 10);

            // Canvasテクスチャ作成
            const paperTexture = new THREE.CanvasTexture(paperCanvas);
            paperTexture.minFilter = THREE.LinearFilter;
            paperTexture.magFilter = THREE.LinearFilter;

            // ベース紙面メッシュ（Z: 0cm）
            const baseGeo = new THREE.PlaneGeometry(0.8, 0.8);
            const baseMat = new THREE.MeshBasicMaterial({ map: paperTexture, side: THREE.DoubleSide });
            const baseMesh = new THREE.Mesh(baseGeo, baseMat);
            newspaperGroup.add(baseMesh);

            // ==========================================
            // 2. 飛び出す立体3D文字（Z: +6cm）
            // ==========================================
            const loader = new THREE.FontLoader();
            loader.load('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/fonts/helvetiker_bold.typeface.json', function (font) {
                const textGeo = new THREE.TextGeometry('3D NEWSPAPER', {
                    font: font,
                    size: 0.048,
                    height: 0.018,
                    curveSegments: 12,
                    bevelEnabled: true,
                    bevelThickness: 0.002,
                    bevelSize: 0.001,
                    bevelSegments: 5
                });

                const textMat = new THREE.MeshStandardMaterial({
                    color: 0x00ff88,
                    emissive: 0x003311,
                    metalness: 0.8,
                    roughness: 0.2
                });

                const textMesh = new THREE.Mesh(textGeo, textMat);
                textMesh.position.set(-0.36, 0.21, 0.06);
                newspaperGroup.add(textMesh);
            });

            // ==========================================
            // 3. 最前面 ホログラムフォトフレーム（Z: +12cm）
            // ==========================================
            const cardCanvas = document.createElement('canvas');
            cardCanvas.width = 512;
            cardCanvas.height = 512;
            const cCtx = cardCanvas.getContext('2d');

            const grad = cCtx.createRadialGradient(256, 256, 20, 256, 256, 256);
            grad.addColorStop(0, '#00e1ff');
            grad.addColorStop(0.8, '#001133');
            grad.addColorStop(1, '#00ff88');
            cCtx.fillStyle = grad;
            cCtx.fillRect(0, 0, 512, 512);

            cCtx.strokeStyle = '#ffffff';
            cCtx.lineWidth = 10;
            cCtx.strokeRect(20, 20, 472, 472);

            cCtx.fillStyle = '#ffffff';
            cCtx.font = 'bold 36px sans-serif';
            cCtx.textAlign = 'center';
            cCtx.fillText('2048px HIGH-RES', 256, 250);
            cCtx.fillText('HOLOGRAM PHOTO', 256, 300);

            const cardTexture = new THREE.CanvasTexture(cardCanvas);
            const cardGeo = new THREE.BoxGeometry(0.28, 0.22, 0.02);
            const cardMat = new THREE.MeshStandardMaterial({
                map: cardTexture,
                roughness: 0.1,
                metalness: 0.5
            });

            photoCard = new THREE.Mesh(cardGeo, cardMat);
            photoCard.position.set(-0.2, 0.0, 0.12);
            newspaperGroup.add(photoCard);

            // ==========================================
            // 4. WebXR 起動
            // ==========================================
            const vrBtn = document.getElementById('enter-vr-btn');
            if ('xr' in navigator) {
                navigator.xr.isSessionSupported('immersive-vr').then((supported) => {
                    if (supported) {
                        vrBtn.addEventListener('click', () => {
                            navigator.xr.requestSession('immersive-vr', {
                                optionalFeatures: ['local-floor']
                            }).then((session) => {
                                renderer.xr.setSession(session);
                                document.getElementById('vr-overlay').style.display = 'none';
                            });
                        });
                    }
                });
            }

            renderer.setAnimationLoop(render);
            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function render(time) {
            if (newspaperGroup) {
                newspaperGroup.rotation.y = Math.sin(time * 0.0008) * 0.12;
            }
            if (photoCard) {
                photoCard.position.y = 0.0 + Math.sin(time * 0.002) * 0.015;
                photoCard.rotation.y = Math.sin(time * 0.001) * 0.15;
            }
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
